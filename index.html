  function injectStyle() {
    var style = document.createElement("style");
    // Hover box is painted by the host (from streamed rects); the guest
    // marks the selected element and, in comment mode, swaps the native
    // cursor for the comment bubble (forced, so page cursor styles don't
    // fight the picker). While a composer or thread card is open the arrow
    // returns, so the bubble cursor and the pin just placed never show at
    // once. Keyed on <html> data attributes, which page scripts that
    // rewrite body.className leave alone; ":not(#_)" lifts the rules to
    // id-level specificity so a page's own !important cursor rules lose.
    var ANY = ":not(#__cwhr_)";
    var MODE = "html[data-cwhr-mode]";
    var COMPOSING = MODE + "[data-cwhr-composing]";
    style.textContent =
      "." + SEL_CLASS + "{outline:1px solid hsl(40 70% 40%) !important;outline-offset:0;}" +
      MODE + ANY + "," + MODE + " " + ANY + "{cursor:" + BUBBLE_CURSOR + " !important;}" +

  function isUnique(sel) {
    try {
      return document.querySelectorAll(sel).length === 1;
    } catch (e) {
      return false;
    }
  }

  // Mirrors the host's stripInvisibles ranges. The host strips these
  // from stored selectors, so a selector built on a value containing
  // them would validate here but never match again - skip those rungs
  // and fall through to the structural ladder instead.
  function hasInvisibles(s) {
    for (var i = 0; i < s.length; i++) {
      var c = s.codePointAt(i);
      if (c > 0xffff) i++;
      if (
        c <= 0x1f ||
        c === 0x061c ||
        c === 0x070f ||
        c === 0xad ||
        (c >= 0x7f && c <= 0x9f) ||
        c === 0x115f ||
        c === 0x1160 ||
        c === 0x180e ||
        (c >= 0x200b && c <= 0x200f) ||
        (c >= 0x202a && c <= 0x202e) ||
        (c >= 0x2060 && c <= 0x2064) ||
        (c >= 0x2066 && c <= 0x2069) ||
        c === 0x3164 ||
        c === 0xfeff ||
        (c >= 0xfff9 && c <= 0xfffb) ||
        c === 0xffa0 ||
        (c >= 0xe0000 && c <= 0xe007f)

        return true;
      }

    return false;
  }

  function escapeAttr(v) {
    return String(v).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
  }

  // Selector ladder: unique #id -> unique [data-*] -> structural
  // tag:nth-of-type path rooted at the nearest unique-id ancestor.
  function selectorFor(el) {
    if (el.id && !hasInvisibles(el.id) && isUnique("#" + CSS.escape(el.id))) {
      return "#" + CSS.escape(el.id);
    }
    for (var i = 0; i < el.attributes.length; i++) {
      var attr = el.attributes[i];
      if (
        attr.name.indexOf("data-") === 0 &&
        attr.value &&
        !hasInvisibles(attr.value)
      ) {
        var dataSel = "[" + attr.name + '="' + escapeAttr(attr.value) + '"]';
        if (isUnique(dataSel)) return dataSel;
      }
    }
    var parts = [];
    var cur = el;
    while (cur && cur !== document.body && cur.nodeType === 1 && parts.length < 10) {
      var sel = cur.tagName.toLowerCase();
      var parent = cur.parentElement;
      if (parent) {
        var sameTag = [];
        for (var c = 0; c < parent.children.length; c++) {
          if (parent.children[c].tagName === cur.tagName) sameTag.push(parent.children[c]);
        }
        if (sameTag.length > 1) {
          sel += ":nth-of-type(" + (sameTag.indexOf(cur) + 1) + ")";
        }
      }
      parts.unshift(sel);
      if (
        parent &&
        parent.id &&
        !hasInvisibles(parent.id) &&
        isUnique("#" + CSS.escape(parent.id))
      ) {
        parts.unshift("#" + CSS.escape(parent.id));
        return parts.join(" > ");
      }
      cur = parent;
    }
    if (cur === document.body) {
      parts.unshift("body");
      return parts.join(" > ");
    }
    // Depth cap hit without a root - an unrooted chain would match the
    // first structural pattern anywhere in the document. Mark the pin
    // detached instead of attaching it to the wrong element.
    return ":not(*)";
  }

  function descriptorFor(el) {
    var tag = "<" + el.tagName.toLowerCase() + ">";
    var idPart = el.id ? " #" + el.id : "";
    var text = visibleText(el).slice(0, 60);
    var textPart = text ? ' "' + text + '"' : "";
    // Nearest id'd ancestor, skipping the UCR-injected
    // #artifacts-component-root-* wrapper which is implementation noise.
    var section = el.parentElement;
    while (
      section &&
      (!section.id || section.id.indexOf("artifacts-component-root") === 0)
    ) {
      section = section.parentElement;
    }
    var sectionPart = section && section.id ? " in #" + section.id : "";
    return (tag + idPart + textPart + sectionPart).slice(0, 400);
  }

  // textContent offset of (node, offset) within body - the coordinate
  // system text-quote anchors are stored in. -1 when the boundary
  // isn't under body (shadow root, detached).
  function textOffset(node, offset) {
    var body = document.body;
    if (!body) return -1;
    try {
      var pre = document.createRange();
      pre.selectNodeContents(body);
      pre.setEnd(node, offset);
      return pre.toString().length;
    } catch (e) {
      return -1;
    }
  }

  // Inverse: build a Range covering [start, end) in body.textContent.
  function rangeForOffsets(start, end) {
    var body = document.body;
    if (!body) return null;
    var walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
    var acc = 0;
    var range = document.createRange();
    var haveStart = false;
    var t;
    while ((t = walker.nextNode())) {
      var next = acc + t.length;
      if (!haveStart && start < next) {
        range.setStart(t, start - acc);
        haveStart = true;
      }
      if (haveStart && end <= next) {
        range.setEnd(t, end - acc);
        return range;
      }
      acc = next;
    }
    return null;
  }

  // Context-scored search (W3C text-quote resolution): slice-check the
  // hint, else pick the occurrence whose surrounding chars best match
  // prefix/suffix. MIRRORS locateTextQuote() above line-for-line - the
  // tested export is the contract; this copy is what the sandbox runs.
  function locateQuote(text, q) {
    var ex = q.exact;
    if (!ex) return null;
    var hint = q.startOffset >= 0 ? q.startOffset : 0;
    if (text.slice(hint, hint + ex.length) === ex) {
      return { start: hint, end: hint + ex.length };
    }
    var best = -1;
    var bestScore = -1;
    var bestDist = Infinity;
    var scanned = 0;
    for (var idx = text.indexOf(ex); idx !== -1 && ++scanned <= 1000; idx = text.indexOf(ex, idx + 1)) {
      var before = text.slice(Math.max(0, idx - CONTEXT_LEN), idx);
      var after = text.slice(idx + ex.length, idx + ex.length + CONTEXT_LEN);
      var sc = 0;
      for (var i = 1; i <= q.prefix.length && i <= before.length; i++) {
        if (q.prefix[q.prefix.length - i] !== before[before.length - i]) break;
        sc++;
      }
      for (var j = 0; j < q.suffix.length && j < after.length; j++) {
        if (q.suffix[j] !== after[j]) break;
        sc++;
      }
      var dist = Math.abs(idx - hint);
      if (sc > bestScore || (sc === bestScore && dist < bestDist)) {
        best = idx;
        bestScore = sc;
        bestDist = dist;
      }
    }
    return best === -1 ? null : { start: best, end: best + ex.length };
  }

  function collectLineRects(range, cap) {
    var out = [];
    var rects = range.getClientRects();
    for (var i = 0; i < rects.length && out.length < cap; i++) {
      var r = rects[i];
      if (r.width > 0 && r.height > 0) {
        out.push({ x: r.left, y: r.top, w: r.width, h: r.height });
      }
    }
    return out;
  }

  function reportTextSel(full) {
    if (!port) return;
    var sel = window.getSelection();
    var r = sel && !sel.isCollapsed && sel.rangeCount > 0 ? sel.getRangeAt(0) : null;
    if (!r || !document.body || !document.body.contains(r.commonAncestorContainer)) {
      if (hasTextSel) {
        hasTextSel = false;
        port.postMessage({ type: "textClear" });
      }
      return;
    }
    hasTextSel = true;
    var br = r.getBoundingClientRect();
    var msg = {
      type: "textCapture",
      rect: { x: br.left, y: br.top, w: br.width, h: br.height },
      lineRects: collectLineRects(r, 80),

      var live = document.body.textContent || "";
      var so = textOffset(r.startContainer, r.startOffset);
      var eo = textOffset(r.endContainer, r.endOffset);

        // Unanchorable selection (shadow root, foreign node). A
        // rect-only post here would make the host pair the new rect
        // with a stale prior anchor - clear instead.
        hasTextSel = false;
        port.postMessage({ type: "textClear" });
        return;
      }
      // Denomination invariant: exact/prefix/suffix are byte-identical
      // slices of body.textContent. Truncation adjusts endOffset so
      // the host's (endOffset - startOffset === exact.length) shape
      // check holds. Cut points back off surrogate halves - a lone
      // surrogate would never relocate and fails UTF-8 persist.
      var capped = Math.min(eo, so + EXACT_CAP);

        var hc = live.charCodeAt(capped - 1);
        if (hc >= 0xd800 && hc <= 0xdbff) capped--;
      }
      if (capped <= so) {
        port.postMessage(msg);
        return;
      }
      var pStart = Math.max(0, so - CONTEXT_LEN);
      var pc = live.charCodeAt(pStart);
      if (pc >= 0xdc00 && pc <= 0xdfff) pStart++;
      var sEnd = Math.min(live.length, capped + CONTEXT_LEN);
      if (sEnd < live.length) {
        var sc = live.charCodeAt(sEnd - 1);
        if (sc >= 0xd800 && sc <= 0xdbff) sEnd--;
      }
      msg.exact = live.slice(so, capped);
      msg.prefix = live.slice(pStart, so);
      msg.suffix = live.slice(capped, sEnd);
      msg.startOffset = so;
      msg.endOffset = capped;
    }
    port.postMessage(msg);
  }

  function clearSelection() {
    if (selected) {
      selected.classList.remove(SEL_CLASS);
      selected = null;
    }
  }

  // rAF-throttled cursor + hover-rect stream so the host can paint the
  // inspector hover box (and knows the pointer is present) in comment mode.
  var cursorPending = false;
  var cursorX = -1;
  var cursorY = -1;
  function flushCursor() {
    cursorPending = false;
    if (!port) return;
    var hover = null;
    if (
      hoverEl &&
      hoverEl.nodeType === 1 &&
      hoverEl !== document.body &&
      hoverEl !== document.documentElement
    ) {
      var r = hoverEl.getBoundingClientRect();
      if (r.width > 0 || r.height > 0) {
        hover = { x: r.left, y: r.top, w: r.width, h: r.height };
      }
    }
    port.postMessage({ type: "cursor", x: cursorX, y: cursorY, hover: hover });
  }
  function scheduleCursor() {
    if (!cursorPending) {
      cursorPending = true;
      requestAnimationFrame(flushCursor);
    }
  }
  function onMouseMove(ev) {
    if (!mode || !port) return;
    // Over the scrollbar gutter (clientX/Y past the content box) - hide
    // the hover box like a leave.
    var de = document.documentElement;
    if (ev.clientX >= de.clientWidth || ev.clientY >= de.clientHeight) {
      cursorX = -1;
      cursorY = -1;
      hoverEl = null;
      scheduleCursor();
      return;
    }
    cursorX = ev.clientX;
    cursorY = ev.clientY;
    hoverEl = ev.target;
    scheduleCursor();
  }
  function onMouseLeave() {
    if (!mode || !port) return;
    cursorX = -1;
    cursorY = -1;
    hoverEl = null;
    scheduleCursor();
  }

  function onClick(ev) {
    if (!port) return;
    if (!mode) {
      // Mode off: don't intercept the page, just let the host close any
      // open popover (thread card click-away). A non-collapsed selection
      // means the click ended a drag-select - not a click-away.
      var s = window.getSelection();
      if (!s || s.isCollapsed) port.postMessage({ type: "clickAway" });
      return;
    }
    ev.preventDefault();
    ev.stopImmediatePropagation();
    var el = ev.target;
    if (!el || el.nodeType !== 1 || el === document.documentElement) return;
    if (el === document.body && el.firstElementChild) {
      // Pin on body is rarely intentional; keep it anyway but as body.
    }
    clearSelection();
    selected = el;
    el.classList.add(SEL_CLASS);
    var rect = el.getBoundingClientRect();
    var pinX = rect.width > 0 ? (ev.clientX - rect.left) / rect.width : 0.5;
    var pinY = rect.height > 0 ? (ev.clientY - rect.top) / rect.height : 0.5;
    port.postMessage({
      type: "capture",
      selector: selectorFor(el).slice(0, 1000),
      textHint: visibleText(el).slice(0, 300),
      descriptor: descriptorFor(el),
      pinX: Math.min(1, Math.max(0, pinX)),
      pinY: Math.min(1, Math.max(0, pinY)),
      clientX: ev.clientX,
      clientY: ev.clientY,
      rectLeft: rect.left,
      rectTop: rect.top,
    });
  }

  function reportRects() {
    rafPending = false;
    if (!port) return;
    // Selected element's live bounds - keeps the host's draft pin /
    // inspector tag / composer glued through scroll and reflow.
    if (selected) {
      var sr = selected.getBoundingClientRect();
      port.postMessage({
        type: "selRect",
        left: sr.left,
        top: sr.top,
        w: sr.width,
        h: sr.height,
        found:
          (sr.width > 0 || sr.height > 0) &&
          document.documentElement.contains(selected),
      });
    }
    var rects = [];
    for (var i = 0; i < pins.length; i++) {
      var p = pins[i];
      var el = null;
      try {
        el = document.querySelector(p.selector);
      } catch (e) {
        el = null;
      }
      if (!el) {
        rects.push({ id: p.id, x: 0, y: 0, found: false });
        continue;
      }
      var r = el.getBoundingClientRect();
      if (r.width === 0 && r.height === 0) {
        rects.push({ id: p.id, x: 0, y: 0, found: false });
        continue;
      }
      rects.push({
        id: p.id,
        x: r.left + p.pinX * r.width,
        y: r.top + p.pinY * r.height,
        found: true,
      });
    }
    var quoteRects = [];
    if (quotes.length > 0) {
      var live = null;
      for (var qi = 0; qi < quotes.length; qi++) {
        var q = quotes[qi];
        var qr = quoteRanges[q.id];
        if (qr === undefined) {
          if (live === null) {
            live = (document.body && document.body.textContent) || "";
          }
          var loc = locateQuote(live, q);
          qr = (loc && rangeForOffsets(loc.start, loc.end)) || null;
          quoteRanges[q.id] = qr;
        }
        // Zero paintable rects (display:none subtree) reports as
        // not-found so the host docks it as detached instead of
        // rendering nothing clickable.
        var qlr = qr ? collectLineRects(qr, 80) : [];
        quoteRects.push(
          qlr.length > 0
            ? { id: q.id, found: true, lineRects: qlr }
            : { id: q.id, found: false, lineRects: [] }
        );
      }
    }
    port.postMessage({
      type: "rects",
      rects: rects,
      quoteRects: quoteRects,
      scrollY: window.scrollY || 0,
    });
  }

  function scheduleRects() {
    if (rafPending) return;
    rafPending = true;
    var done = false;
    function run() {
      if (done) return;
      done = true;
      reportRects();
    }
    // rAF for paint alignment, with a timeout fallback - rAF is
    // suspended entirely in hidden tabs and pins must still settle
    // when the tab becomes visible after background loading.
    requestAnimationFrame(run);
    setTimeout(run, 150);
  }

  function setMode(on) {
    mode = !!on;
    document.documentElement.toggleAttribute("data-cwhr-mode", mode);
    if (!mode) {
      hoverEl = null;
      clearSelection();
    }
  }

  function setComposing(open) {
    document.documentElement.toggleAttribute("data-cwhr-composing", !!open);
  }

  function onPortMessage(ev) {
    var data = ev.data;
    if (!data) return;
    if (data.type === "mode") setMode(data.on);
    else if (data.type === "composing") setComposing(data.open);
    else if (data.type === "pins") {
      pins = Array.isArray(data.pins) ? data.pins : [];
      scheduleRects();
    } else if (data.type === "quotes") {
      quotes = Array.isArray(data.quotes) ? data.quotes : [];
      quoteRanges = Object.create(null);
      scheduleRects();
    } else if (data.type === "clearSelection") {
      clearSelection();
    } else if (data.type === "clearTextSel") {
      var ts = window.getSelection();
      if (ts) ts.removeAllRanges();
      hasTextSel = false;
    } else if (data.type === "restoreScroll") {
      var ry = Number(data.y);
      if (isFinite(ry) && ry > 0) {
        // Apply now and again at load - late images/fonts can grow the
        // document after the first attempt clamps short.
        window.scrollTo(0, ry);
        window.addEventListener("load", function () {
          window.scrollTo(0, ry);
        });
      }
    }
  }

  function start() {
    injectStyle();
    var channel = new _MessageChannel();
    port = channel.port1;
    port.onmessage = onPortMessage;
    // Sandboxed srcdoc origins can be opaque; "*" is required. The
    // payload carries only the mount token (multiple sandboxes can be
    // mounted at once - the token routes the port to the right overlay)
    // and the channel port itself is pairwise-secure.
    _topPost(
      { type: READY_TYPE, token: "c25ab162-7380-4008-bb24-3636d217108b" },
      "*",
      [channel.port2]
    );
    document.addEventListener("mousemove", onMouseMove, true);
    // documentElement (not document, capture) so this fires only when the
    // pointer leaves the viewport - capture-phase on document would fire for
    // every intra-document element-boundary crossing.
    document.documentElement.addEventListener("mouseleave", onMouseLeave);
    document.addEventListener("click", onClick, true);
    // Text-selection capture: commit on mouseup/keyup (Shift+Arrow),
    // clear on collapse. Not mode-gated; highlight-to-comment is
    // always on.
    function onSelCommit() { reportTextSel(true); }
    document.addEventListener("mouseup", onSelCommit, true);
    document.addEventListener("keyup", onSelCommit, true);
    document.addEventListener("selectionchange", function () {
      var s = window.getSelection();
      if (hasTextSel && (!s || s.isCollapsed)) reportTextSel(false);
    });
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape" && port) port.postMessage({ type: "dismiss" });
    }, true);
    // Scroll/resize move the hovered element under a stationary pointer -
    // re-report its rect so the host's inspector box tracks it. Mutations
    // stay rects-only (animating pages would chatter the cursor stream).
    var textSelPending = false;
    function scheduleTextSel() {
      if (textSelPending) return;
      textSelPending = true;
      requestAnimationFrame(function () {
        textSelPending = false;
        reportTextSel(false);
      });
    }
    function onLayoutChange() {
      scheduleRects();
      if (mode && hoverEl) scheduleCursor();
      if (hasTextSel) scheduleTextSel();
    }
    window.addEventListener("scroll", onLayoutChange, true);
    window.addEventListener("resize", onLayoutChange);
    // Full-cache invalidate per childList mutation is acceptable: CSS
    // animation doesn't fire the observer; JS writers at frame rate
    // would re-relocate every frame but are rare. characterData isn't
    // observed, so .data= edits leave highlights stale until the next
    // childList mutation.
    var observer = new MutationObserver(function () {
      quoteRanges = Object.create(null);
      scheduleRects();
      if (hasTextSel) scheduleTextSel();
    });
    function observe() {
      if (document.body) observer.observe(document.body, { childList: true, subtree: true });
    }
    if (document.body) observe();
    else document.addEventListener("DOMContentLoaded", observe);
    // Settle pins after late layout (fonts, images).
    setInterval(scheduleRects, 2000);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();

  --bad:#d93a3a; --bad-soft:#fdeaea; --red:#e0262f; --adm:#7a4bd1; --adm-soft:#f1eafd;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.55}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
header{position:sticky;top:0;z-index:20;background:rgba(246,244,239,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header .in{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;cursor:pointer;flex:1;white-space:nowrap}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:#eee;color:var(--sub);white-space:nowrap}
.pill.on{background:var(--ok-soft);color:var(--ok)}
.pill.adm{background:var(--adm-soft);color:var(--adm)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:99px;white-space:nowrap;color:var(--sub)}
.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 15px;border-radius:10px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none}
.btn:hover{border-color:#c9c5bb}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.adm{background:var(--adm);border-color:var(--adm);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.icon{border:none;background:none;font-size:20px;padding:4px 6px;border-radius:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin:12px 0}
.card.admbox{background:var(--adm-soft);border-color:#ddd0f6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.end{justify-content:flex-end}
.muted{color:var(--sub);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.chap{cursor:pointer;margin:0;transition:transform .1s}
.chap:hover{transform:translateY(-2px)}
.chap h3,.libc h3{margin:0 0 4px;font-size:16px}
.libc{margin:0;display:flex;flex-direction:column}
.libc .row{margin-top:auto;padding-top:10px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:#fff1e0;color:#b4620b;margin-right:4px}
.sec-title{font-size:14px;color:var(--sub);margin:22px 0 4px;font-weight:600}
h2{font-size:20px;margin:16px 0 4px}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field label{font-size:13px;color:var(--sub)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%}
textarea{resize:vertical;min-height:90px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:none;background:#fff;padding:7px 12px;color:var(--sub)}
.seg button.active{background:var(--ink);color:#fff}
.items{list-style:none;margin:0;padding:0}
.items li{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)}
.items li:last-child{border-bottom:none}
.items .q{flex:1;min-width:0}
.items .a{flex:1;min-width:0;color:var(--sub)}
.items .ex{display:block;font-size:12px;color:#8a8f98;margin-top:2px}
.items .acts{display:flex;gap:2px}
.items .acts button{border:none;background:none;color:var(--sub);padding:2px 6px;border-radius:6px}
.items .acts button:hover{background:#f0eee8}
.red{color:var(--red);font-weight:600}
.typebadge{font-size:11px;padding:1px 6px;border-radius:5px;background:#eee;color:var(--sub);white-space:nowrap;margin-top:3px}
.typebadge.cloze{background:#fde8e8;color:var(--red)}
.typebadge.pattern{background:#e8f0ff;color:var(--pri)}
.paste{border:2px dashed #d5d1c7;border-radius:12px;min-height:110px;padding:12px;background:#fffdf8;outline:none;overflow:auto;max-height:200px}
.paste:empty:before{content:attr(data-ph);color:#aaa}
.drop{border:2px dashed #d5d1c7;border-radius:12px;padding:22px;text-align:center;background:#fffdf8;cursor:pointer;color:var(--sub)}
.drop.over{border-color:var(--pri);background:var(--pri-soft)}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;max-height:50vh;overflow:auto;padding:2px}
.part{border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;user-select:none;background:#fff;font-size:13px}
.part b{display:block;font-size:14px}
.part.sel{border-color:var(--pri);background:var(--pri-soft)}
.part.have{position:relative}
.part.have:after{content:'✓ 추가됨';position:absolute;right:6px;top:6px;font-size:10px;color:var(--ok)}
/* study */
.progress{height:8px;background:#e8e5dd;border-radius:99px;overflow:hidden;margin:8px 0 14px}
.progress>div{height:100%;background:var(--pri);transition:width .25s}
.stats3{display:flex;gap:14px;font-size:14px;flex-wrap:wrap}
.flash{perspective:1200px;cursor:pointer;margin:12px 0}
.flash .inner{position:relative;min-height:240px;transition:transform .45s;transform-style:preserve-3d}
.flash.flipped .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:24px;font-weight:600;word-break:keep-all}
.flash .back{transform:rotateY(180deg);background:#fbfaff}
.flash .exs{font-size:14px;font-weight:400;color:var(--sub);margin-top:12px;line-height:1.5}
.flash .hint{position:absolute;bottom:10px;font-size:12px;color:#aaa;font-weight:400}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px 22px;margin:12px 0;font-size:20px;line-height:1.9;word-break:keep-all}
.qbox.center{text-align:center;font-size:24px;font-weight:600}
.mask{display:inline-block;min-width:3.2em;padding:0 8px;margin:0 2px;border-radius:7px;background:#ffd9d9;color:transparent;border-bottom:2px solid var(--red);cursor:pointer;user-select:none;line-height:1.5;transition:.15s}
.mask.show{background:transparent;color:var(--red);font-weight:700}
.blank{border:none;border-bottom:2px solid var(--red);background:#fff5f5;border-radius:6px 6px 0 0;padding:2px 6px;margin:0 2px;font-size:18px;text-align:center;outline:none;min-width:4em;max-width:100%}
.blank.ok{border-color:var(--ok);background:var(--ok-soft)}
.blank.no{border-color:var(--bad);background:var(--bad-soft)}
.fix{font-size:14px;color:var(--ok);font-weight:700;margin-left:2px}
.answer-in{width:100%;font-size:18px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;outline:none}
.answer-in:focus{border-color:var(--pri)}
.verdict{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px}
.verdict.ok{background:var(--ok-soft);color:#14663a}
.verdict.no{background:var(--bad-soft);color:#9a2323}
.verdict.info{background:#f3f2ee;color:var(--ink)}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.bigbtns .btn{padding:14px;font-size:16px;border-radius:12px}
.result-num{font-size:52px;font-weight:800;text-align:center;margin:10px 0 0}
.bar{height:10px;border-radius:99px;background:#eee;overflow:hidden;flex:1}
.bar>div{height:100%;background:var(--ok)}
.empty{text-align:center;color:var(--sub);padding:34px 10px}
.modal-bg{position:fixed;inset:0;background:rgba(20,22,26,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow-y:auto}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 6px;font-size:18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:99;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
@media (max-width:560px){
  .qbox{font-size:18px;padding:20px 16px}
  .flash .face{font-size:21px}
  .items li{flex-wrap:wrap}
  .items .a{flex-basis:100%}
}
</style>

3개월} ), 뒤집기( {4개월} ), 앉기( {6개월} ), 기기( {7~9개월} ), 잡기( {8~9개월} ), 서기( {10개월} )"},{"type":"cloze","q":"가장 좋은 이유식 시기는? ( {6개월} )"},{"type":"cloze","q":"예방접종의 차례와 시기는? ( {B형간염(1주일이내)} - {BCG(4주이내)} - {DPT(2,4. 6개월)} - {MMR(12~15개월)} - {일본뇌염(12~24개월)} )"},{"type":"cloze","q":"DPT는? ( {디프테리아} , {파상풍} , {백일해} )"},{"type":"cloze","q":"MMR은? ( {홍역} , {볼거리(유행성이하선염)} , {풍진} )"},{"type":"cloze","q":"대변 가리기는 ( {12~18} )개월, 소변은 ( {16~24} )개월"},{"type":"cloze","q":"소아 중이염은 성인에 비해 ( {유스타키오관} )이 ( {넓고} ), ( {곧고} ), ( {짧기} ) 때문에 잘 발생한다."},{"type":"cloze","q":"아동이 38℃ 이상의 고열 시 찬물이나 얼음 베개를 해주며 ( {발} )은 따뜻하게 한다."},{"type":"cloze","q":"알코올 마사지는 ( {30~50} )% 알코올을 사용하며, 제대소독은 ( {65~75} )% 알코올을 사용한다."},{"type":"cloze","q":"노인의 ( {렘} )수면은 일정하나 ( {비렘} )수면은 짧아져 깊은 수면이 불가하다."},{"type":"cloze","q":"심한 출혈 시 가장 먼저 상처 부위를 ( {직접압박} ) 하여 출혈을 막는다."},{"type":"cloze","q":"피의 양은 체중의 ( {1/13} )이며 이 중 ( {1/2} )이 소실되면 사망한다."},{"type":"cloze","q":"쇼크 시 다리를 ( {올려} )주고 쇼크의 악화 예방을 위해 보온은 하지만 직접적인 ( {열-더운물주머니} )은 금한다."},{"type":"cloze","q":"사고 현장에서는 ( {대출혈} ) 및 ( {호흡 정지} ) 환자를 가장 먼저 처치한다."},{"type":"cloze","q":"환자의 의식을 사정할 때 가장 먼저 사용하는 방법은? ( {언어적 자극} )"},{"type":"cloze","q":"깊고 좁은 상처로 파상풍의 감염률이 가장 높은 창상의 종류는? ( {자상} )"},{"type":"cloze","q":"상처회복 및 피부재생의 효과가 뛰어난 비타민의 종류는? ( {비타민C (아스코르빈산)} )"},{"type":"cloze","q":"뱀에 물린 경우 물린 부위를 심장보다 ( {아래쪽으로} ) 위치시킨다."},{"type":"cloze","q":"일사병은 땀 분비가 ( {많고} ) 열사병은 땀 분비가 ( {없다} )"},{"type":"cloze","q":"온도와 습도가 높아 체온조절중추인 시상하부의 기능장애가 원인인 열중증은? ( {열사병} )"},{"type":"cloze","q":"얼굴 부위의 화상은 ( {호흡} )상태를 확인하고 우선적으로 기도를 유지하며 물집은 ( {터트리지 않는다} )"},{"type":"cloze","q":"팔 한쪽과 다리 한쪽 가슴에 화상을 입었다면 몇 % 화상인가? ( {36%} )"},{"type":"cloze","q":"혈청, 예방백신은 ( {2~5℃ 냉암소} )에 보관하고 좌약은 ( {실온} )에 보관한다."},{"type":"cloze","q":"약물을 계속 사용할 경우 같은 치료 효과를 얻기 위해 사용량을 증가해야 하는 현상을 ( {내성} )이라 한다."},{"type":"cloze","q":"약물을 오랫동안 사용하다가 중지할 때 정신적, 육체적으로 그 약을 갈망하는 것을 약물의 ( {의존성} )이라 한다."},{"type":"cloze","q":"호흡 억제 작용이 있어 투약 전 반드시 호흡수를 확인해야 하는 약물은 ( {몰핀} , {데메롤} )이고, 맥박을 측정하는 약물은( {디기탈리스} )이며 ( {헤파린} , {와파린} , {코마딘} )은 pe":"cloze","q":"침상 목욕의 일반적인 순서 :( {얼굴} → {팔} → {가슴} → {배} → {다리} → {등} → {음부} )"},{"type":"cloze","q":"통 목욕 시 물의 온도는? 성인 ( {42 -44} ) ℃, 유아 ( {40.5} )℃"},{"type":"cloze","q":"통 목욕 중 졸도를 한 경우 먼저 통속의 물을 빼주고, ( {다리} )는 올려준다."},{"type":"cloze","q":"알콜목욕 (치료적 목욕)시 사용되는 알콜은? ( {30 – 50} )% 알콜 사용"},{"type":"cloze","q":"전신 소양증이 있는 경우 ( {중조목욕} , {전분목욕} )을 실시하고 ( {미온수} )로 목욕을 한다."},{"type":"cloze","q":"등 마사지 시 뼈 돌출 부위나 천골 부위가 ( {붉게} )변할 경우, 조직 손상의 방지를 위해 ( {마사지} )를 중지한다."},{"type":"cloze","q":"구취의 원인 제거와 백태 낀 혀의 죽은 조직을 제거하는데 효과적인 것은?( {과산화수소} )"},{"type":"cloze","q":"위관 영양의 길이는?( {코-귀볼-검상돌기} )/ 체위는?( {반좌위} )"},{"type":"cloze","q":"위관영양 위관의 위치 확인 방법? ⓵{위 내용물을 흡인} , ⓶{관 끝은 물그릇에 넣고 공기 방울 확인} , ⓷{공기 넣은 후 청진} , ⓸{X_RAY 촬영하기}"},{"type":"cloze","q":"연동운동을 촉진하여 배변을 유도하기 위한 관장은? ( {배변 관장(청정 관장)} ), 5~10cm"},{"type":"cloze","q":"장내 기름을 주입하여 변을 부드럽게 해 변을 배출하는 관장은?( {윤활 관장} )"},{"type":"cloze","q":"장내 가스를 제거하기 위해 실시하는 관장은? ( {구풍 관장} )"},{"type":"cloze","q":"약물을 여러 시간 동안 장 내에 머물러 있게 하여 치료적 효과는 내는 관장은? ( {정체 관장} )"},{"type":"cloze","q":"지혈이 목적인 관장은? ( {수렴 관장} )"},{"type":"cloze","q":"관장 시 직장관을 ( {배꼽} ) 쪽을 향하게 하여 삽입한다."},{"type":"cloze","q":"관장통에 용액이 약간 남아 있을 때 조절기를 잠그고 관장촉을 뽑는 이유는?( {공기로 장내로 들어가는 것을 예방} )"},{"type":"cloze","q":"관장약 주입 시 복통을 호소하면 ( {30초} ) 정도 용액 주입을 멈추었다가 서서히 주입하기 시작한다."},{"type":"cloze","q":"장루(인공항문) 환자 간호 시 주의사항 중 점액질이나 피가 섞인 대변과 장루의 색깔이 적갈색, 보라색, 검은색으로 변한 상태는 ( {장루괴사} )가 의심되므로 즉시 보고한다."},{"type":"cloze","q":"장루 환자는 ({배추나 양배추, 무, 양파} ) 등 배설물의 냄새를 증진시키고, 가스를 형성하는 음식은 피해야 한다."},{"type":"cloze","q":"유치도뇨인 경우, 소변배액 주머니는 항상 방광의 위치보다 ( {아래} )에 놓아 소변이 역류 되는 것을 예방해야 한다."},{"type":"cloze","q":"체위 변경은 최소 ( {2시간} ) 마다 실시해야 한다."},{"type":"cloze","q":"요추 천자 후 요통이나 두통과 척수액 누출 방지를 위해 취해야 할 체위는?( {앙와위} )"},{"type":"cloze","q":"호흡곤란 시 취해야 할 체위는? ( {파울러씨 체위(반좌위)} )"},{"type":"cloze","q":"관장, 항문 검사 시 체위는? ( {심스 체위(측와위)} )"},{"type":"cloze","q":"산후 운동, 자궁 내 태아의 위치 교정을 위한 체위는? ( {슬흉위} )"},{"type":"cloze","q":"생식기와 방광 검사 및 분만을 위한 체위는? ( {절석위(쇄석위)} )"},{"type":"cloze","q":"근육의 길이는 변하지만, 근육에 걸리는 힘은 변하지 않는 운동은? (수영, 조깅, 자전거 타기 등)( {등장성 운동} )"},{"type":"cloze","q":"관절을 움직이지 않고 특정 근육을 강화시키는 운동? (석고붕대를 했을 때 실시하는 운동)( {등척성 운동} )"},{"type":"cloze","q":"편마비 환자 이동 시 계단을 오를 때 :( {지팡이} → {건강한 쪽 다리} → {마비된 쪽 다리} )"},{"type":"cloze","q":"편마비 환자 이동 시 계단을 내려갈 때, 평지를 걸을 때 : ( {지팡이} → {마비된 쪽 다리} → {건강한 쪽 다리} )"},{"type":"cloze","q":"수술 상처나 피부 병변을 긁지 못하도록 할 때 사용되는 것은?( {팔꿈치 억제대(주관절 억제대)} )"},{"type":"cloze","q":"더운물 주머니 물의 온도는 ( {46-52} ) ℃, 공기를 뺀 후 주머니를 ({거꾸로} ) 들고 물이 새지 않는지 확인, ({20-30} )분 간 지속"},{"type":"cloze","q":"더운물 주머니 사용 금지 환자 : ( {충수돌기염} )"},{"type":"cloze","q":"편도선 수술 후의 출혈 방지와 염증 방지를 위해 사용되는 것은 ( {얼음목도리} )이다."},{"type":"cloze","q":"동맥혈중 산소 분압은? ( {90-100} ) mmHg"},{"type":"cloze","q":"산소 투여 방법 중 ( {비강 캐뉼라} )는 대상자에게 적용하기 쉽고, 대상자가 말하고 먹을 수 있어 편하다."},{"type":"cloze","q":"체내 산소 부족시 나타나는 증상은? ( {불안} , {호흡수 증가} , {맥박의 증가} , {청색증} , {안절부절 등} )"},{"type":"cloze","q":"기도 흡인 시 한 번 흡인하는 최고 시간은 ( {10초} ) 이내로 하고, 총 흡인 시간은 ( {5분} )을 넘으면 안됨."},{"type":"cloze","q":"기관절개가 빠져 있는 경우 간호조무사는 의사가 올 때까지( {멸균된 겸자} )로 기관절개 부위를 벌려야 함."},{"type":"cloze","q":"상처 드레싱 시 일반적으로 (1.{깨끗한 곳에서 더러운 곳} ), (2.{상처 안쪽에서 바깥쪽} ), (3.{위에서 아래} )로 닦는다."},{"type":"cloze","q":"({욕창 예방} )을 위해 밑 홑이불에 주름진 곳이 없도록 팽팽하게 잡아당겨 피부 압력이나 마찰을 감소해야 한다."},{"type":"cloze","q":"붕대 감을 때 주의사항은 ( {신체 말단 부위} )에서 ( {체간} )을 향해 감기 시작하고, ( {상처} )위에서 붕대를 감기 시작하거나 끝내지 말아야 한다."},{"type":"cloze","q":"골절 교정에 가장 많이 쓰이는 방법은? ( {석고 붕대} )"},{"type":"cloze","q":"견인의 목적은 ( {뼈가 일직선이 되도록 교정} ) 하는 것이고, 과도한 견인은 ( {뼈} )가 붙지 않으므로 주의해야 함."},{"type":"cloze","q":"수술을 위한 금식은 수술 전날 밤 ( {10시} ) 이후부터 수분이나 음식을 구강으로 섭취하는 것을 일체 금함."},{"type":"cloze","q":"수술 전 금식의 목적은? 1. {마취 중 기도로 이물 흡입 방지}, 2. {수술 후 오심, 구토 예방}"},{"type":"cloze","q":"복부 수술( {제왕 절개 시} ) 환자의 삭모 부위는 상부는 ( {유두선} )부터 하부는 ( {서혜부} ) 중간까지이다."},{"type":"cloze","q":"삭모는 ( {솜털까지} ) 완전히 제거하고 털이 난 방향으로 면도를 실시 한다."},{"type":"cloze","q":"수술 전 투약 시간은? ( {수술 30분 전에} ) / 노인은 ( {한 시간 전} )"},{"type":"cloze","q":"아트로핀의 투약 목적은? ( {수술 중 호흡기계 분비물 억제} ）"},{"type":"cloze","q":"모르핀, 데메롤의 투약 목적은? （{수술 전 불안, 공포, 스트레스 제거} )"},{"type":"cloze","q":"리도카인 투약 목적은? ( {국소 마취를 위해 사용} / {부정맥치료} )"},{"type":"cloze","q":"수술실에서 손 소독을 마친 간호사가 손을 들고 있는 이유는? ( {손의 오염 방지} )"},{"type":"cloze","q":"흡수성 봉합사는? ( {장선, 크로믹, 덱손} )"},{"type":"cloze","q":"비흡수성 봉합사는? ( {나일론, 실크} )"},{"type":"cloze","q":"수술 후 마취 회복기의 환자 간호는? ( {심호흡과 기침 유도} ), 체위는 ( {앙와위} )"},{"type":"cloze","q":"수술 후 환자의 하지 운동? ( {침대에 걸터 앉아 다리 흔들기} ) (혈전성 정맥염 예방)"},{"type":"cloze","q":"수술 후 조기 이상이 중요한 이유? ( {호흡기, 순환기 합병증 예방} )"},{"type":"cloze","q":"감염병을 앓고 있었는데 또 다른 감염병에 걸린 경우? ( {중복 감염} )"},{"type":"cloze","q":"환자와 환자 사이에서 의료진이 매개체가 되어 교차적으로 감염시키는 것은? ( {교차감염} )"},{"type":"cloze","q":"염증의 국소 4대 증상은? ( {열감} , {발적} , {종창} , {동통} )"},{"type":"cloze","q":"투약 시 경구투약의 기름 종류의 약은 ( {차게} ) 해서 준다."},{"type":"cloze","q":"약물의 투여 원칙? ( {정확한 약물} , {정확한 대상자} , {정확한 용량} , {정확한 시간} , {정확한 경로} )"},{"type":"cloze","q":"투약 시 한 병에서 다른 병으로 ( {약을 옮기면} ) 안되고, 약물 너무 많이 따랐을 경우 ( {약병에 다시 붓지} ) 않는다."},{"type":"cloze","q":"질약은 질 후원개로 잘 흡수되기 위해 ( {둔부} )를 올리고 있도록 한다."},{"type":"cloze","q":"피하주사? ( {예방주사} , {인슐린} , {헤파린 주사 등} ), 주사 후 비비지 말고 살며시 눌러 준다."},{"type":"cloze","q":"약물 효과 순서는?: ( {정맥} → {근육} → {피하} → {경구} )"},{"type":"cloze","q":"근육주사는 피하주사보다 ( {혈관분포} )가 더 많아 약의 빠른 흡수를 얻을 수 있다."},{"type":"cloze","q":"근육주사로 가장 많이 사용되는 근육은? ( {둔근} ), 이유는 ( {근육이 커서 반복 사용 가능하고, 흡수가 빠르다.})"},{"type":"cloze","q":"3세 이하 근육 주사 시 가장 많이 사용되는 부위는: ( {대퇴외측광근} )"},{"type":"cloze","q":"피내주사? ( {투베르쿨린 반응} , {알레르기 반응검사} , {약물 과민 반응 검사} , {BCG 주사 시 사용} )"},{"type":"cloze","q":"피내주사 시 주의점? ( {문지르기 않는다} ) 사용부위는 ( {전완의 내측면} )"},{"type":"cloze","q":"정맥 주사 시 약물 주입 시 IV 세트 내에 공기를 배출시키는 이유는? ( {공기로 인한 색전증을 예방하기 위함}. )"},{"type":"cloze","q":"사후 처리로 가장 먼저 환자를 반듯이 눕히고, ({사망 후 2-4시간 전} ) 에 사후강직이 오기 전에 사지를 똑바로 한다."},{"type":"cloze","q":"환자는 침상에서 안정을 취하고 모든 일은 의료 요원이 해주는 것? ( {절대안정(ABR)} )"},{"type":"cloze","q":"방사선 요법은 주로 ( {악성 종양} )을 제거하는데 이용된다."},{"type":"cloze","q":"통증 원발 부위에서 멀리 떨어진 다른 부위에서 느끼는 통증을 무엇이라고 하는가? ( {방사 통증(연관통)} )"},{"type":"cloze","q":"암 환자 치료요법은? ( {수술요법} , {화학적 약물요법} , {방사선요법} )"},{"type":"cloze","q":"암 환자 간호 시 가장 중요한 것은? ( {감염 예방} )"},{"type":"cloze","q":"악성 종양 세포의 특징은? ①{성장 속도가 빠르다.} ②{주위 조직을 침범한다}. ③{피막이 없고 재발 전이된다}."},{"type":"cloze","q":"암을 확실하게 진단 내릴 수 있는 검사는? ( {세포검사(조직검사)} )"},{"type":"cloze","q":"쇼크 환자의 증상? ( {청색증 , 심계항진, 혈압 및 체온 저하, 빠르고 약한 맥박 등} )"},{"type":"cloze","q":"쇼크 환자의 간호 중 가장 우선으로 해야 할 것은? ( {하지 상승(골반 고위)} )"},{"type":"cloze","q":"유방 절제 후 재활 운동은? 어깨 관절과 관련된 운동: ⓵{머리 빗기} ⓶{브래지어 잠그기} ⓷{줄 올리기} ⓸{손으로 벽 기어오르기 등}"},{"type":"cloze","q":"경련 환자 간호 시 주의사항은? 1. {고개 옆으로}, 2. {옷 풀어주기}, 3.{주변의 물건 제거}, 4.{억제대 금지}, 5. {환자 회복 전까지 구강 섭취 금지}"},{"type":"cloze","q":"성인 뼈의 수? 총 ( {206} )개"},{"type":"cloze","q":"뼈를 보호, 골절 시 뼈를 재생시키는 역할? ( {골막} )"},{"type":"cloze","q":"혈구를 생산하는 것은? ( {골수} )"},{"type":"cloze","q":"골다공증의 원인은? ( {폐경 후 여성호르몬(에스트로겐)의 결핍} )"},{"type":"cloze","q":"손바닥과 손가락의 저림, 손의 감각 이상이 발생하는 증후군? ( {수근관증후군} )"},{"type":"cloze","q":"호흡기의 구조? ( {비강} → {인두} → {후두} → {기관} → {기관지} → {폐포} )"},{"type":"cloze","q":"정상인의 1회 호흡량은? ( {500} )cc"},{"type":"cloze","q":"호흡기는 가장 흔하며 위험한 병원체의 ( {탈출 통로} )이다."},{"type":"cloze","q":"기관지 천식은 특히 ( {밤} )에 증상이 심하며, 치료제는 ({아미노필린(기관지 확장제)})을 투여해야 하고, 예방법은 알레르기 원인 물질과의 접촉을 금하는 것이다."},{"type":"cloze","q":"기관지경 검사 전에는 ({금식} )을 해야 하고, 구개 반사가 돌아올 때까지 금식을 시키고, ({호흡곤란} )을 관찰해야 함."},{"type":"cloze","q":"수술 후 호흡기계 합병증으로 가장 많이 오는 것은? ( {무기폐와 폐렴} )"},{"type":"cloze","q":"기도 내 이물질이 들어가 발생한 폐렴은? ( {흡인성 폐렴} )"},{"type":"cloze","q":"폐농양( 농흉) 환자 체위는 아픈쪽이 ({아래로} ) 눕게 하고, ({오한과 밤에 다량의 발한})이 발생하고, 치료제는 ({페니실린})"},{"type":"cloze","q":"늑막염 치료를 위한 ( {늑막 천자} ) 시에는 환자에게 두 팔을 머리 위로 올리게 한다."},{"type":"cloze","q":"만성적인 산소 결핍으로 손가락 끝이 곤봉 모양으로 변하며 손톱이 숟가락처럼 굽는 것은? ( {고상지두} )"},{"type":"cloze","q":"고상지두가 나타나는 질환은? ( {폐암, 폐농양, 기관지 확장증, 폐기종} )"},{"type":"cloze","q":"뇌하수체 전엽 분비 호르몬은? ( {성장호르몬} , {갑상선자극호르몬} , {부신피질자극호르몬} , {난포자극호르몬} , {황체형성호르몬}, {젖샘자극호르몬} )"},{"type":"cloze","q":"뇌하수체 후엽 분비 호르몬은? ( {옥시토신} , {항이뇨호르몬} )"},{"type":"cloze","q":"성장기(연골접합 전) 성장호르몬 과잉 시 ( {거인증} ), 분비가 부족하면 ( {난쟁이} ), 성인(연골접합 후)에게 과다 분비 시 ( {말단비대증} ) 발생함."},{"type":"cloze","q":"난포자극호르몬은 여성호르몬인 ( {에스트로겐} ) 을 분비, 황체형성호르몬은 여성에게는 ( {프로게스테론} ), 남성에게는 ( {테스토스테론} ) 분비를 촉진시킨다."},{"type":"cloze","q":"젖샘자극호르몬은 ( {프로락틴} )이라고 부르며 젖의 분비를 촉진한다."},{"type":"cloze","q":"옥시토신은 ( {자궁벽} )을 수축시켜 분만을 용이하게 함."},{"type":"cloze","q":"항이뇨호르몬은 혈압의 상승을 유도하고, 분비가 저하되면 ( {요붕증} )을 유발한다."},{"type":"cloze","q":"갑상선호르몬이 과잉 시 ( {그레이브스병, 바제도병} )에 걸리고, 결핍 시 갑상선 기능저하증인 ( {점액수종} )이 발생하고, 어린이에게는 ( {크레틴증} )을 유발한다."},{"type":"cloze","q":"췌장에서는 인슐린( {혈당 저하 작용} ), 글루카곤( {혈당 상승 작용} )을 분비한다."},{"type":"cloze","q":"갑상선 기능 항진증은 ( {그레이브스병} )을 유발하고, ( {체중감소} , {안구돌출} , {심계항진} ) 등이 증상이며, 치료제로 ( {요오드} )를 이용한다."},{"type":"cloze","q":"당뇨병의 3대 증상은? ( {다음, 다식, 다뇨} )"},{"type":"cloze","q":"1형 당뇨병은 ({인슐린 의존성 당뇨병} )이고, 40세 이전에 발생하여 ({소아당뇨} )라고도 한다."},{"type":"cloze","q":"2형 당뇨병은 ({인슐린 비의존성 당뇨병} )이며, 40세 이후에 발생하고 인슐린이 없이 ({식이, 운동요법} )으로 조절 가능"},{"type":"cloze","q":"당뇨병 환자 간호 시 특히 ( {발} ) 간호에 주의, 상처 나지 않도록 주의, 발톱은 줄로 다듬거나 ({일자} )로 자른다."},{"type":"cloze","q":"혈액의 총량은 체중의 ( {1/13} )(5L)이고, 혈장이 55%, 혈구가 45%로 구성되고, 적혈구는 ( {골수} )에서 생성되고 산소를 운반하는 ( {헤모글로빈} )을 함유하고, 백혈구는 ( {식균작용} )을 하며 6,000-8,000개가 정상 수치이다."},{"type":"cloze","q":"철분결핍성빈혈은 철 함유량이 저하되어 발생하고, 증상으로 ( {숟가락 모양의 손톱} )이 나타난다."},{"type":"cloze","q":"악성빈혈은 ( {비타민 B12} )가 부족하여 나타나며, 재생불량성 빈혈은 ( {골수} )의 기능이 저하되어 발생하고, 용혈성 빈혈은 ( {적혈구} )의 파괴가 빨라 적혈구량이 부족하여 발생하는데, ( {황달, 비장비대} )등이 나타난다."},{"type":"cloze","q":"백혈병은 ( {비정상적인백혈구 증가} )되는 질환으로, 감염 예방을 위해 ( {역격리} )가 필요하다."},{"type":"cloze","q":"수혈 시 ( {O형} )은 모두에게 수혈이 가능하고, 수혈로 인한 부작용을 예방하기 위해 수여자와 공여자의 ( {혈액형} )이 일치하는지 확인하고 수혈 시작 후 ({발열, 오한, 두통, 호흡곤란 등} )이 나타나면 수혈을 중지하고 의사에게 보고한다."},{"type":"cloze","q":"소화기계의 경로는? ( {구강} - {인두} - {식도} - {위} - {십이지장} - {공장} - {회장} - {맹장} – {결장} –{직장} - {항문} )"},{"type":"cloze","q":"소화성궤양은 ( {십이지장} )에서 가장 많이 발생하고 진통제 ( {아스피린} ) 복용을 금지해야 한다."},{"type":"cloze","q":"급속이동 증후군은 위암환자의 위절제 수술 후에 발행하고 식후 ( {5-30분} ) 사이에 발생하고, ({어지러움, 실신, 심계항진, 복통} ) 등이 발생"},{"type":"cloze","q":"완전 위절제술 환자인 경우 ( {비타민 B12} )가 흡수되지 않아 ( {악성빈혈} )이 발생한다."},{"type":"cloze","q":"급속이동증후군을 예방하기 위해서는 ( {횡와위(측위)} )로 식사하며 식사 중 ( {수분섭취 금지} ), 식후 ( {20-30분} )은 눕도록 하고, 소량씩 자주 섭취하며, ( {탄수화물} )은 줄이고 ( {지방} )을 섭취하여 음식물이 위에 정체되는 시간을 늘린다."},{"type":"cloze","q":"충수염(충수돌기염)의 통증 부위는? ( {맥버니 부위의 통증(우측 하복부 통증)} )"},{"type":"cloze","q":"충수염의 3대 금기사항은? ( {온찜질, 진통제 투여, 관장} → 심해지면 복막염으로 진행 )"},{"type":"cloze","q":"위천공의 증상은 갑자기 발생하는 ( {상복부 통증} )이며 응급상황으로 즉각적인 수술이 필요하다."},{"type":"cloze","q":"췌장의 소화기관의 역할로 아밀라제( {탄수화물 소화} ), 리파아제( {지방 소화} ), 트립신( {단백질 소화} )을 분비한다."},{"type":"cloze","q":"A형 간염은 ( {대소변에 오염된 음식물} ), B형간염과, C형 간염은( {혈액} )으로 전염이 된다."},{"type":"cloze","q":"간경화증 환자의 식이는? ( {고단백} , {고탄수화물} , {저지방} , {고비타민} )"},{"type":"cloze","q":"비뇨기의구조? ( {신장} – {요관} – {방광} – {요도} )"},{"type":"cloze","q":"성인의 1일 정상 소변 배출량은 ( {1,500-2,000} )cc이고 하루 ( {400} )cc 이하이거나 시간당 ( {30} )cc 이하로 배출 시 의사에게 보고해야 한다."},{"type":"cloze","q":"동정맥루는 ({동맥과 정맥} )을 이어주는 수술로, ({신부전} ) 환자들의 투석에 이용되고, 동정맥루가 있는 팔로는 무거운 물건을 들면 안되며, 동정맥루가 설치된 팔에서 ( {혈압 측정} ), 시계, 팔찌 착용 금지."},{"type":"cloze","q":"심장근육에 산소와 영양분을 제공하는 동맥은? ( {관상동맥} )"},{"type":"cloze","q":"혈액 순환의 순서 : ( {우심방} – {우심실} – {폐동맥} – {폐} – {폐정맥} – {좌심방} – {좌심실} – {대동맥} – {전신} - {대정맥} )"},{"type":"cloze","q":"폐정맥은 ( {동맥혈} )이 흐르고, 폐동맥은 ( {정맥혈} )이 흐른다."},{"type":"cloze","q":"좌심실이 우심실에 비해 두꺼운 이유? ( {산소가 풍부한 동맥혈을 대동맥을 통해서 전신에 공급하기 위해서} )"},{"type":"cloze","q":"고혈압은? 수축기 ( {140} ) mmhg, 이완기 ( {90} )mmhg이상인 경우"},{"type":"cloze","q":"고혈압 환자의 식이는? ( {저염식이와 저지방식이} )"},{"type":"cloze","q":"심근에 일시적인 혈액 공급 부족으로 심한 흉부 통증이 나타나는 관상동맥 질환은? ( {협심증} )"},{"type":"cloze","q":"협심증의 치료제는? ( {니트로글리세린을 혀 밑에 한 알 투약 (5분 간격 3번까지 가능)} )"},{"type":"cloze","q":"체온조절 중추는? ( {시상하부} )"},{"type":"cloze","q":"호흡조절 중추는? ( {연수} )"},{"type":"cloze","q":"뇌실에서 생성되고 지주막하강을 흐르고 있는 액체는? ( {뇌척수액(CSF)} )"},{"type":"cloze","q":"교감신경계? ( {동공 확장, 심장박동 촉진, 기관지 확장, 침샘 분비 억제, 땀샘 분비 촉진} )"},{"type":"cloze","q":"부교감신경계? ( {동공 수축, 심장박동 억제, 기관지 수축, 침샘 분비 촉진} )"},{"type":"cloze","q":"의식 수준: {명료}({깨어있는 상태}) - {기면}({졸린 상태}) - {착란}({지남력 장애}) - {혼미}({동통 반응 O, 언어 반응 O})"},{"type":"cloze","q":"- {반혼수}({동통 반응 O, 언어반응X}) - {혼수}({동통, 언어반응 모두 X})"},{"type":"cloze","q":"뇌압 상승 간호 : ( {상체 상승, 절대 안정, 과호흡, 의식 확인, 변비 예방(변완화제), 활력 징후 측정} )"},{"type":"cloze","q":"소양증시 : ( {전분, 중조, 과망간산칼륨 목욕 실시, 칼라민 로션 국소 도포} )"},{"type":"cloze","q":"보건교육은 적정기능 수준 향상을 위한 ( {지식} )→( {태도} )→( {행동} )등을 바람직하게 변화시키는 것"},{"type":"cloze","q":"보건교육의 목적은? 지역사회 구성원 ( {스스로 건강문제} )를 해결할 수 있는 능력을 갖도록 하는 것"},{"type":"cloze","q":"보건교육은 가장 ( {포괄적} )이고 중요하다."},{"type":"cloze","q":"보건사업 중 가장 능률적이고 효과적인 것은? ( {학교보건} )"},{"type":"cloze","q":"보건교육의 대상은? ( {지역사회 주민 전체} )"},{"type":"cloze","q":"보건교육 평가종류 - 교육 전: ( {진단평가} ), 교육 중: ( {형성평가} ), 교육 후: ( {총괄평가} )"},{"type":"cloze","q":"보건교육 시 학습자의 주의를 집중시키며 (학습 동기, 흥미)를 유발할 수 있는 단계는? ( {도입} )"},{"type":"cloze","q":"보건교육 후 평가 방법 중 임산부들에게 신생아 목욕법을 실시 후 평가하는 방법은? ( {관찰법} )"},{"type":"cloze","q":"보건교육 방법 중 가장 효과적이고 개별 지도를 위해 사용되는 수단은? ( {면접(면담)} )"},{"type":"cloze","q":"면담 시 신뢰감을 형성하기 위해 가장 중요한 것은? ( {청취하는 태도} )"},{"type":"cloze","q":"2-5명의 전문가가 각자의 의견을 10-15분 정도 발표하는 토론 방법은(발표자, 청중 모두 전문가)? ( {심포지엄} )"},{"type":"cloze","q":"어떤 주제에 대해 상반된 의견(찬,반)을 가진 전문가 4-7명이 토의하는 방법은(발표자만 전문가)? ( {패널토의} )"},{"type":"cloze","q":"아이디어의 자유로운 흐름으로 창의성을 활용할 수 있는 교육법은? ( {브레인스토밍} )"},{"type":"cloze","q":"대중을 단시간에 교육시킬 수 있는 가장 좋은 매체는? ( {TV, 라디오} )"},{"type":"cloze","q":"급성 감염병 발생 시 가장 효과적으로 일반 대중에게 알릴 수 있는 방법은? ( {대중매체} )"},{"type":"cloze","q":"건강에 대한 태도 및 행위를 변화시키는 데 효과적이며 대규모 국민에게 전달 가능한 매체는? ( {TV} )"},{"type":"cloze","q":"국가별 보건지표 및 지역사회의 건강 상태나 보건사업 수준을 평가할 때 가장 많이 사용되는 지표는? ( {영아사망률})"},{"type":"cloze","q":"새로이 특정 건강 문제가 발생한 수를 비율로 나타낸 것은? ( {발생률} )"},{"type":"cloze","q":"현재 특정 건강 문제를 갖고 있는 사람의 수를 비율로 나타낸 것은? ( {유병률} )"},{"type":"cloze","q":"중앙보건행정기구는? ( {보건복지부} )"},{"type":"cloze","q":"감염병, 만성질환, 희귀질환을 관리하는 기관은? ( {질병관리청} )"},{"type":"cloze","q":"보건소의 설치 기준은? ( {시, 군, 구} )에 설치"},{"type":"cloze","q":"보건소 간호사업의 대상은? ( {지역사회 주민 전체} )"},{"type":"cloze","q":"보건소 보건프로그램 운영 시 우선적으로 조사해야할 사항은? ( {지역주민의 건강(보건) 요구도})"},{"type":"cloze","q":"생애주기별 보건요구도를 조사한 결과 청소년과 성인층은 ( {흡연예방과 금연사업} ), 노인층에서는 ( {정신건강문제} ), 산모와 영·유아층에서는 ( {산모의 산전관리} )를 1순위를 선택함."},{"type":"cloze","q":"보건지소는 설치 기준은? ( {읍, 면마다} ) 1개소씩 설치"},{"type":"cloze","q":"1980년 농어촌 등 보건의료를 위한 특별조치법에 의해 1981년부터 무의촌에 설치된 것은? ( {보건진료소} )"},{"type":"cloze","q":"벽·오지 지역사회간호에서 중추적인 역할을 하는 보건의료 인력은? ( {보건진료 전담공무원} )"},{"type":"cloze","q":"세계 모자보건 향상에 기여하는 국제 기구는? ( {유엔아동기금(UNICEF)} )"},{"type":"cloze","q":"세계보건기구(WHO) 본부는 ( {스위스 제네바} ) 에 있으며 우리나라가 속하는 지역사무소는 ( {서태평양 지역} )이다."},{"type":"cloze","q":"보건의료전달체계의 목적은? 보건의료 수요자에게 ( {적정한 의료} ) 제공"},{"type":"cloze","q":"우리나라의 보건의료전달체계는? ( {자유방임형} )이며 ( {1,2,3차} ) 의료 체계로 구분됨"},{"type":"cloze","q":"전체 보건의료전달체계의 70-80%를 차지하는 1차 보건의료기관? ( {의원, 보건소, 보건지소, 보건진료소 등} )"},{"type":"cloze","q":"2차 보건의료기관은? 의료시설 장비등이 갖추어진, ( {병원} )을 말함."},{"type":"cloze","q":"3차 보건의료기관은? 전문의가 있는 ( {대학병원, 종합병원} )"},{"type":"cloze","q":"일차보건의료는 1978년 ({알마아타 회의} )에서 처음 선언이 되고, 일차 보건의료를 수행하기 위한 공무원은 ({보건진료 전담공무원})"},{"type":"cloze","q":"일차 보건의료의 정의는? 지역사회 공동의 노력이 요구되며 가장 ({기본적} )이고 ({포괄적} )인 접근법을 의미한다."},{"type":"cloze","q":"일차보건의료의 기본정신은? ( {주민 스스로 자신의 건강에 책임을 지도록 함.} )"},{"type":"cloze","q":"우리나라의 4대 사회보험은? ( {국민건강보험} , {고용보험} , {국민연금} , {산업재해보상보험(산재보험)} )"},{"type":"cloze","q":"- ({노인장기요양보험} )을 합치면 5대 사회보험이 됨."},{"type":"cloze","q":"국가가 보험료 부담이 없는 저소득층의 의료를 공공부조 방식으로 보조하는 것? ( {의료급여} )"},{"type":"cloze","q":"국민건강보험의 특성? ( {강제가입, 보험료의 차등 결정, 보험급여의 균등 수혜, 본인 일부 부담제} )"},{"type":"cloze","q":"우리나라의 진료비의 특성? ( {행위별 수가제} ) 와 7개 질병군에 한해 ( {포괄수가제} ) 병행, ( {제3자 지불방식} )"},{"type":"cloze","q":"우리나라의 진료비 지불제도 중 하나로 의사의 적극적인 서비스 제공이 장점이며, 과잉진료로 국민 총 의료비의 증가하는 단점이 있다. ( {행위별 수가제} )"},{"type":"cloze","q":"개인의 건강을 위해 지출되는 비용을 포함하여, 한 국가의 국민이 한 해 동안 보건의료를 위해 지출하는 총의료비는 무엇? ( {국민의료비} )"},{"type":"cloze","q":"국민의료비의 증가 요인은? ( {인구의 노령화, 만성질환(노인질병)의 증가, 병원을 찾는 빈도 증가 등} )"},{"type":"cloze","q":"기후의 3대 요소? ( {기온, 기습, 기류(바람)} )"},{"type":"cloze","q":"온열요소 4가지? ( {기온, 기습, 기류, 복사열} )"},{"type":"cloze","q":"일반적으로 말하는 기습(습도)는? ( {비교습도} )를 말하고 ( {40-70} )%가 정상"},{"type":"cloze","q":"기류 측정 도구는? ( {카타온도계} )"},{"type":"cloze","q":"불쾌지수 75이상의 의미는? ( {50} )%이상의 사람이 불쾌감 호소"},{"type":"cloze","q":"불쾌지수 80이상의 의미는? ( {거의 모든} ) 사람이 불쾌감 호소"},{"type":"cloze","q":"자외선의 작용? ( {성장과 신진대사, 적혈구 생성, 비타민 D 형성, 살균작용, 색소 침착, 피부암 발생 등} )"},{"type":"cloze","q":"적외선의 작용? ( {화상과 홍반, 중추신경계 장애, 일사병, 백내장 등} )"},{"type":"cloze","q":"조도가 낮으면? ( {시력저하, 안구진탕증의 원인이 됨} )"},{"type":"cloze","q":"온실효과를 발생시키는 것은? ( {이산화탄소(CO2}) )"},{"type":"cloze","q":"일정한 공간에 다수가 밀집되어있는 경우 발생하는 것은? ( {군집독} )"},{"type":"cloze","q":"군집독의 원인? ( {이산화탄소 증가} )"},{"type":"cloze","q":"대기오염의 원인? ( {대기오염물(매연,먼지,가스등), 무풍, 기온역전} )"},{"type":"cloze","q":"일산화탄소(CO)의 서한량(어떤경우도 넘어서는 안되는 경계량) 농도는? ( {0.01} )%"},{"type":"cloze","q":"산성비의 원인이며 자극성 취기, 점막 자극, 염증, 호흡곤란을 유발하는 것은? ( {아황산가스(SO2)} )"},{"type":"cloze","q":"혈액 중에 증가하면 호흡수를 증가시키는 것은? ( {이산화탄소(CO2)} )"},{"type":"cloze","q":"이산화탄소의 허용 농도는? ( {0.1} )%"},{"type":"cloze","q":"자동차 배기 가스에 의해 발생하고, 자외선 중 인간에게 해로운 파장이 제거되지 못하여 기후온난화와 피부암을 초래하는 현상은? ( {오존층 파괴} )"},{"type":"cloze","q":"빗물이 PH5.6 이하이고 금속물과 석조 건물을 부식시키며 토양의 오염 및 하천의 산성화를 유발하는 것은? ({산성비})"},{"type":"cloze","q":"환경오염 관련 부담금으로 화석연료를 사용하는 경우 세를 부과하는 ( {탄소세} )와 환경오염의 원인자로 하여금 환경개선에 필요한 금액을 지불하게 하는 ( {환경개선부담금} )이 있다."},{"type":"cloze","q":"1893년 미국과 독일에서 강물을 여과하여 장티푸스, 이질 등의 환자를 감소하게 한 현상은?( {밀즈-라인케 현상} (상수도관리) )"},{"type":"cloze","q":"염소 소독을 하였을 때 수중에 잔존하는 유리 염소를 말하는 것은? ( {잔류 염소} )"},{"type":"cloze","q":"소독력이 강하고 잔류효과가 크며, 조작이 간편하여 가격이 저렴한 반면 염소 고유의 냄새와 독성이 남아 있게되는 소독? ( {염소 소독} )"},{"type":"cloze","q":"({용존산소, DO} )가 높다는 것은 깨끗한 물을 의미하고, ({생물학적 산소요구량, BOD} )가 높다는 것은 오염이 되었다는 것을 의미함."},{"type":"cloze","q":"DO가 높으면 BOD는 낮고, DO가 낮으면 BOD는 높으며, BOD가 ({20ppm} )이상이면 오염으로 본다."},{"type":"cloze","q":"수질의 분변오염의 지표이며 검출 방법이 간단하고 정확한 것은? ( {대장균군} (유해성병원균여부 추측가능) )"},{"type":"cloze","q":"미세한 플랑크톤이 바다에 무수히 발생해 해수가 적색으로 변하는 현상은? ( {적조현상} )"},{"type":"cloze","q":"생활하수의 유입으로 영양염류의 과다로 물빛이 녹색으로 변하는 현상은? ( {녹조현상} )"},{"type":"cloze","q":"녹조현상 예방을 위해서는 ( {생활하수} )를 충분히 정화하여 내보내야 한다."},{"type":"cloze","q":"메틸수은의 중독으로 사지마비, 정신이상, 언어장애가 발생하는 것? ( {미나마타병} )"},{"type":"cloze","q":"카드뮴 중독으로 발생하는 것? ( {이타이이타이병} )"},{"type":"cloze","q":"염소 소독된 물이 염소 처리 후 세균이 평상시보다 과다하게 증가하는 현상? ( {부활현상} )"},{"type":"cloze","q":"우리나라에서 가장 많이 사용되는 생활폐기물 처리법? ( {매립법} )"},{"type":"cloze","q":"가장 위생적인 방법이지만 공기 오염을 유발하거나 전선이나 PVC를 태울 때 다이옥신을 발생시켜 문제가 되는처리법은? ( {소각법} )"},{"type":"cloze","q":"폐기물 발생을 억제하고, 폐기물 처리에 드는 비용을 제품의 제조업자와 수입업자에게 부담하도록 하는 제도는? ({폐기물부담금제도} )"},{"type":"cloze","q":"식중독의 특징은 단시간({24시간} ) 내에 발생하며, ({집단적} )으로 발생하고, 환자에 의한 2차 감염이 드물다."},{"type":"cloze","q":"6-9월에 주로 발병하고, 고열, 복통증상을 보이며 장관점막에 작용하는 장내세균 감염형 식중독? ( {살모넬라증} )"},{"type":"cloze","q":"병원성 호염균에 의한 식중독, 여름철에 생선회, 어패류에 의해서 많이 발생하는 감염형 식중독은? ( {장염비브리오} )"},{"type":"cloze","q":"통조림, 소세지 등이 원인으로 신경계 급성중독을 일으키고 가장 사망률이 높은 독소형 식중독은? ( {보툴리누스} )"},{"type":"cloze","q":"장독소에 의해 발생하고 우리나라에서 가장 많이 발생하는 식중독으로 100도에서 30분간 끓여도 파괴되지 않는 독소형 식중독은? ( {포도상구균 식중독} )"},{"type":"cloze","q":"복어독은 ({테트로도톡신} ), 버섯독은 ({무스카린/아마톡신} ), 감자독은 ( {솔라닌} ), 조개중독은 ({삭시토신/미틸로톡신})"},{"type":"cloze","q":"복어독은 복어의 ({난소 , 고환 , 내장} )에 많고, 호흡중추신경의 마비 증상을 유발하며, 끓는 물에 9시간 이상 가열해야 독성이 사라짐."},{"type":"cloze","q":"인수공통 감염병은? {일탄, 공장 브결(일본뇌염, 탄저병, 공수병, 장출혈성대장균, 브루셀라증, 결핵),조류독감, 야콥병}"},{"type":"cloze","q":"우유의 관리는 ({저온살균법} )으로 62-63도에서 30분간 가열처리해야 ({영양손실} )이 가장 적다."},{"type":"cloze","q":"직접 세균을 죽이지 않고 세균의 성장과 번식을 억제하는 보존법은? ( {방부} )"},{"type":"cloze","q":"여름철 냉방 시 실내외의 온도차? ( {5-8도} ) 가 적당함"},{"type":"cloze","q":"근로기준법 상 1일 근로시간은 ({8시간} )을 초과할 수 없고, ({15세} )미만은 근로할 수 없으며, 15세 이상 18세 미만은 1일 ( {7시간} ) , 주 ( {40시간} )을 초과할 수 없다."},{"type":"cloze","q":"유해한 사업장에서 근무하는 근로자의 건강유지를 목적으로 실시하는 건강검진은? ( {특수건강진단} )"},{"type":"cloze","q":"산업장 근로자에게 업무 도중 사건이 발생하여 인명 손상 및 상해, 경제적 손실이 초래되는 것은? ( {산업재해} )"},{"type":"cloze","q":"정신적, 육체적, 신경적인 노동부하에 반응하는 생체의 상태는? ( {산업피로} )"},{"type":"cloze","q":"직업환경관리에서 유해 요소에 대한 관리 방법으로 덜 유해하거나 덜 위험한 물질을 대신 사용하는 것? ( {대치(대체}))"},{"type":"cloze","q":"수동에서 자동으로 변화시키고, 페인트 작업을 분무식에서 전기흡착식으로 변화시키는 것은? ( {대치(대체)} )"},{"type":"cloze","q":"특정의 직업에 종사하는 근로자에게 발생하는 특정의 질병? ( {직업병} )"},{"type":"cloze","q":"고기압하에서 작업 후 급속히 감압이 이루어질 때 체내에 녹아 있던 질소가스가 혈중으로 배출되어 공기색전증을 유발하는 직업병은? ( {잠함병} )"},{"type":"cloze","q":"교량가설, 터널공사, 잠수작업자에게 발생하는 직업병은? ( {잠함병} )"},{"type":"cloze","q":"고지대를 빠른 속도로 오를 때 생기는 이상? ( {고산병, 항공병} )"},{"type":"cloze","q":"반복적인 소음에 노출되어 코르티기관이 파괴되고 청각 이상이 오는 직업병은? ( {직업성 난청} )"},{"type":"cloze","q":"진동에 의한 골관절 장애로 착암기를 사용하는 근로자의 손가락이 창백해지고 말초 순환 장애를 일으키는 직업병은? ( {레이노 증후군} )"},{"type":"cloze","q":"납중독은 ( {빈혈, 월경장애, 유산, 신경장애} )를 일으키고, 축전지 이용 직업, 인쇄공에게서 발생한다."},{"type":"cloze","q":"고온 작업 환경에서 근육노동 시 수분 및 염분의 손실로 인해 나타나는 증상은 ( {열경련} )이고, 식염수 및 짠 음식을 제공한다."},{"type":"cloze","q":"산업장에서 쓰는 벤젠에 의해서 발생하는 직업병은? ( {재생불량성 빈혈} )"},{"type":"cloze","q":"분진에 의해 발생하는 폐질환은? ( {진폐증} )"},{"type":"cloze","q":"석영의 분진을 흡입하여 생기는 건강장애는? ( {규폐증} )"},{"type":"cloze","q":"규폐증은 폐의 섬유증식성 변화가 일어나 말기에는 합병증으로 ( {결핵} )이 발생"},{"type":"cloze","q":"석면폐증은 ( {폐암} )발생을 높임"},{"type":"cloze","q":"공중보건학 정의? 조직적인 지역사회의 노력 → ( {질병예방} , {수명연장} , {건강증진} )"},{"type":"cloze","q":"사람들의 건강을 개선시키고 조정 능력이 증가하도록 이끌어 가는 과정? ( {건강증진} )"},{"type":"cloze","q":"건강증진의 궁극적 목표? ( {삶의 질 향상} , {건강수명 연장} )"},{"type":"cloze","q":"지역사회 건강 증진사업의 주된 철학? ( {건강생활의 실천} )을 위한 개인 스스로 책임을 강조"},{"type":"cloze","q":"매슬로우의 기본욕구? ( {생리적 욕구} - {안전의 욕구} - {소속의 욕구} - {자아존중의 욕구} - {자아실현의 욕구} )"},{"type":"cloze","q":"국민건강증진법에 의한 범국민 건강 생활 실천 내용? ( {금연} , {절주} , {운동} , {영양} )"},{"type":"cloze","q":"인구집단의 건강 수준을 나타내는 보건지표로 어떤 인구의 어느 연간 사망자의 평균연령을 뜻? ( {평균수명} )"},{"type":"cloze","q":"평균수명에서 질병이나 부상으로 인해 활동 못한 기간을 뺀 기간을 의미하는 것은? ( {건강수명} )"},{"type":"cloze","q":"질병 발생의 3대 요인? ( {병인} , {환경} , {숙주} )"},{"type":"cloze","q":"질병 예방의 분류에서 1차 예방은 질병 발생을 예방하는 단계로 ( {예방주사, 보건교육, 상담, 환경개선 등} )이 포함되고, 2차 예방은 ({조기 진단, 조기 치료} )의 단계, 3차 예방은 ( {재활 및 사회복귀 촉진} )이다."},{"type":"cloze","q":"병원체가 숙주에 침입하여 알맞은 기관에 자리잡고 증식하는 능력? ( {감염력} )"},{"type":"cloze","q":"병원체가 감염된 숙주에게 현성 질병을 일으키는 능력? ( {병원력} )"},{"type":"cloze","q":"지방의 특수 사정에 의해서 발생하고 감염병 발생 양상으로 간디스토마가 대표적인 예? ( {토착성(지방적) 발생} )"},{"type":"cloze","q":"2-4년 마다 한 번씩 유행이 일어나는 주기적 발생을 하는 대표적인 예는? ( {백일해} )"},{"type":"cloze","q":"세균성 감염병? {장이 걸레가 되어 폐백을 성디 (장티푸스, 세균성이질, 결핵, 폐렴, 백일해, 성홍열, 디프테리아)}"},{"type":"cloze","q":"바이러스성 감염병? {인간이 천일동안 소이처럼 열심히 하면 얼굴에 홍광이 난다. (인플루엔자, 간염, 천연두, 일본뇌염, 소아마비, 유행성이하선염, 홍역, 광견병)}"},{"type":"cloze","q":"감염병의 전파되는 방법 중 출입구의 손잡이, 쇼핑카트의 손잡이를 통해 균이 전파되는 방법은? ( {간접적 접촉} )"},{"type":"cloze","q":"병원체의 탈출구? ( {호흡, 위장, 비뇨생식 경로, 손상된 피부, 혈액 등} )"},{"type":"cloze","q":"세균의 침입? ( {점막 감염, 경피적 감염, 상기도 감염, 경구적 감염 등} )"},{"type":"cloze","q":"크기가 작아 전자 현미경으로만 관찰이 가능하고 세균 여과막을 통과하므로 여과성 병원체라 불리는 것? ( {바이러스} )"},{"type":"cloze","q":"병원체가 침입했으나 임상 증상이 전혀 없어 감염병 관리상 가장 관리가 어려운 보균자? ( {건강 보균자} )"},{"type":"cloze","q":"임상증상이 소실되어도 계속 병원체를 배출하는 보균자? ( {회복기 보균자( 장티푸스, 세균성 이질 )} )"},{"type":"cloze","q":"잠복기 중에 타인에게 병원체를 전파시키는 사람? ( {잠복기 보균자(홍역, 백일해, 디프테리아, 유행성이하선염)} )"},{"type":"cloze","q":"비정상적인 면역반응으로 기관지 근육의 수축과 혈압 저하 등 생명을 위협하는 즉각적인 반응? ( {아나필라틱 쇼크} )"},{"type":"cloze","q":"감염병에 감염되어 생기는 면역? ( {자연능동면역} )"},{"type":"cloze","q":"인공적으로 항원을 투여해서 면역을 얻는 방법(예방 주사)? ( {인공능동면역} )"},{"type":"cloze","q":"태아가 모체의 태반, 모유를 통해 얻는 면역? ( {자연수동면역} )"},{"type":"cloze","q":"회복기 혈청, 면역 혈청, 감마글로블린, 항독소를 통해 얻는 면역? ( {인공수동면역} )"},{"type":"cloze","q":"감염병 발생 후 간호조무사의 역할? ( {감염자 및 보균자 색출} )"},{"type":"cloze","q":"디프테리아의 진단은 ({시크 테스트} ), 성홍열 진단은 ({딕테스트} ), 장티푸스 진단은 ({위달테스트} ), 매독의 진단은 ({바서만 테스트, VDRL} )이다."},{"type":"cloze","q":"고열, 두통, 딸기모양 혹은 고양이 혓바닥처럼 증상이 나타나고, 치료제는 페니실린인 질병은? ( {성홍열} )"},{"type":"cloze","q":"두통, 고열, 구토, 경련, 경부강직 등의 증상이 나타나고 설파제, 페니실린 등이 치료제인 질병은? ( {뇌막염} )"},{"type":"cloze","q":"결핵의 치료 식이는? ( {고단백, 고지방, 고탄수화물, 고비타민} )"},{"type":"cloze","q":"결핵 진단 검사는 ( {투베르쿨린} )이고, 판독 시간은 검사 후 ( {48-72시간} )이며 검사액은 ( {PPD} )이고, 검사액 보관온도는 ( {2-5} )℃ 냉암소에 보관하며 예방접종 약은 ( {BCG} ) 이다."},{"type":"cloze","q":"결핵 집단 검사 시 순서는? ( {투베르쿨린 반응검사} → {X-선 간접촬영} → {X-선 직접촬영} → {객담검사} )"},{"type":"cloze","q":"결핵환자 물품은 ( {일광소독} )이 필요하고, 객담 채취 시기는 ( {아침에 일어나자마자} ) 채취하도록 한다."},{"type":"cloze","q":"호흡기계 바이러스성 질환의 예? ( {감기, 홍역, 유행성 이하선염} )"},{"type":"cloze","q":"홍역의 증상 중 카타르기 시기에 입안에 ( {코플릭스 반점} )이 나타난 후 발진은 ({목, 귀 아래} )부터 시작된다."},{"type":"cloze","q":"A형간염은 ( {대변이나 오염된 음식물} )을 통해, B형간염은 ( {혈액, 정액, 체액} ) 등을 통해 감염이 된다."},{"type":"cloze","q":"살모넬라가 원인이며 매개물은 오염된 물이나 음식물이고, 장출혈, 장천공 등이 합병증이며, 클로람페니콜이 특효약인 감염병은? ( {장티푸스} )"},{"type":"cloze","q":"심한 구토와 설사, 쌀뜨물 같은 설사를 발생하고 격리 및 분비물은 소독 후 처리해야 하는 감염병은? ( {콜레라} )"},{"type":"cloze","q":"복통, 설사, 전신권태 등이 증상, 하복부의 보온, 수분보충이 필요하고 설파제, 욕창 예방이 필요? ( {세균성 이질} )"},{"type":"cloze","q":"숙주에 침입한 병원체에 대항하여 감염이나 발병을 저지할 수 없는 상태, 질병이 발생하기 쉬운상태? ( {감수성} )"},{"type":"cloze","q":"접촉자의 발견이 어렵기 때문에 그 관리가 매우 어려운 병? ( {성병} )"},{"type":"cloze","q":"성병 중 발생빈도가 가장 높고 페니실린이 치료제인 성병은? ( {임질} )"},{"type":"cloze","q":"매독의 태아 감염을 예방하기 위한 치료 시기와 치료제는? ( {임신 16-20주 이전, 페니실린} )"},{"type":"cloze","q":"후천성면역결핍증(AIDS)의 주된 사망 원인은? ( {카리니 폐렴, 카포시 육종} )"},{"type":"cloze","q":"에어컨의 냉각탑, 저수탑 등의 철저한 청소가 필요하고, 물에서 증식했던 균이 작은 비말형태로 공기를 통해 전파되어 폐렴 증상을 나타내는 질환은? ( {레지오넬라증} )"},{"type":"cloze","q":"덜 익은 돼지고기 섭취 시 ( {유구조충=갈고리촌중} ) 감염이 발생, 덜 익은 소고기 섭취 시 ( {무구조충=민촌충} )"},{"type":"cloze","q":"소아에게 가장 많이 발생하고 야채를 잘 씻지 않고 먹었을 때 발생하는 기생충 감염은? ( {회충} )"},{"type":"cloze","q":"오염된 흙 위를 맨발로 다닐 경우 감염되며 피부, 채소를 통해 감염되는 기생충? ( {십이지장충} )"},{"type":"cloze","q":"수태 성충이 항문 주위에 나와서 산란하므로 소양감 및 수면장애가 발생하는 기생충 감염은? ( {요충} )"},{"type":"cloze","q":"요충의 진단 방법은? ( {항문 주위 도말법} )"},{"type":"cloze","q":"낙동강, 한강 유역에서 많이 발생하고 민물고기의 생식에 의해 발생하는 감염증? ( {간디스토마(간흡충증)} )"},{"type":"cloze","q":"간디스토마의 중간 숙주? ( {쇄우렁이} ) (제1중간숙주)- ( {담수어} ) (제2중간숙주)"},{"type":"cloze","q":"폐디스토마의 중간 숙주는? ( {다슬기} ) (제1중간숙주)- ( {참게, 참가재} ) (제2중간숙주)"},{"type":"cloze","q":"우리나라에서 감염률이 높으며 여자의 질, 남자의 전립선, 요도 등에 기생하는 기생충 질환? ( {트리코모나스} )"},{"type":"cloze","q":"수인성 감염병의 특징은 환자 발생률이 ( {폭발적} )이고, ( {동시에} ) 발생하고, 사망률이 ( {낮고} ), 이차감염은 없다."},{"type":"cloze","q":"발병 원인이 다양하고 발생 시점이 불분명, 장시간에 걸친 치료와 감시가 필요한 질병은? ( {만성질환} )"},{"type":"cloze","q":"만성질환의 종류? ( {고혈압, 심장병, 뇌졸중, 당뇨병, 관절염, 암등} )"},{"type":"cloze","q":"고혈압 환자의 식이 요법은? ( {저지방, 저염 식이} )"},{"type":"cloze","q":"일정 기간에 있어서 인구 변동 상황을 말하고 보건학적으로 중요한 의미를 지니는 것은? ( {인구 동태} )"},{"type":"cloze","q":"인구 동태에 활용되는 지표는? ( {출생률, 사망률, 혼인율, 이혼률, 전입률, 전출율 등} )"},{"type":"cloze","q":"성비는 여자인구 ({100명}) 당 남자 인구수를 말하고, 1차성비는 ( {태내의 성비} ), 2차 성비는( {출생시의 성비} ), 3차 성비는 ({현재 성비} )를 의미하고, ({2차 성비} )는 장래 인구를 추정하는 좋은 자료가 된다."},{"type":"cloze","q":"2차 성비 110의 의미는? ( {여자 100 : 남자 110} )"},{"type":"cloze","q":"다산다사형, 사망률보다 출산률이 높으며 저개발국가에서 많이 나타나는 인구구조는? ( {피라미드형(인구증가형)} )"},{"type":"cloze","q":"출생률과 사망률이 모두 낮고 인은 소산소사형이며 선진국에서 나타나고 가장 이상적인 인구구조는? ( {종형(인구정지형)} )"},{"type":"cloze","q":"사망률이 낮으나 출생률보다는 높아 인구가 감소하는 감소형 구조로 프랑스, 일본에서 보이는 인구구조는? ( {항아리형(인구감퇴형)} )"},{"type":"cloze","q":"생산연령층 인구가 도시로 유입되어 15-64세 인구가 전체 50%를 초과하는 인구구조는? ( {별형(도시형, 유입형)} )"},{"type":"cloze","q":"생산연령층 인구가 도시로 빠져나간 농촌 인구 형태로 15-64세 인구가 전체 인구의 50% 미만? ( {표주박형(호로형, 농촌형, 유출형)} )"},{"type":"cloze","q":"출생률이 사망률보다 낮고, 0~14세 인구가 65세 이상 인구의 2배에 미치지 못하는 인구유형? ( {항아리형} )"},{"type":"cloze","q":"인구조사는 1925년에 처음 시작하여 매 ( {5년} ) 마다 시행하고 있다."},{"type":"cloze","q":"경제활동 연령은 ( {15-64세} )이고, 노령화지수가 높다는 것은 ( {노년 인구} )의 증가를 말하고 ( {노인부양비} )지출이 높다."},{"type":"cloze","q":"영구적 피임법은: 남 - ( {정관결찰술} ), 여 - ( {난관결찰술} )"},{"type":"cloze","q":"배란작용을 억제하고 세계적으로 가장 많이 사용되고 있는 피임법은? ( {경구피임약} )"},{"type":"cloze","q":"수정란의 자궁 내 착상을 방지하는 피입법? ( {자궁내장치(루프, IUD)} )"},{"type":"cloze","q":"성병예방에 가장 효과적인 피임법은? ( {콘돔} )"},{"type":"cloze","q":"기초체온법은 아침에 잠이 깨었을 때 ( {누운 채로} ) 측정하고, 체온이 올랐다는 것은 ( {배란} )을 의미한다."},{"type":"cloze","q":"모자보건 향상에 크게 기여하고 있는 국제기관? ( {유엔아동기금(UNICEF)} )"},{"type":"cloze","q":"모자보건사업이 중요한 이유는 대상이 인구 전체의 ( {50-70} ) %을 차지하고, 질병에 ({취약한 집단} )이며, 질병을 방치하면 ({사망률} )이 높기 때문이다."},{"type":"cloze","q":"지역사회 임산부 및 영유아의 건강관리 및 안전 분만 시설을 제공하는 것은? ( {모자보건센터} )"},{"type":"cloze","q":"예방 접종 후 주의사항은 접종 당일 ( {목욕} ) 금지, 귀가 후 ( {3시간} ) 동안 주의 깊게 관찰이 필요하다."},{"type":"cloze","q":"학교보건이 공중 보건상 중요한 이유는? ( {학생 인구가 전체 약 1/4을 차지하기 때문} )"},{"type":"cloze","q":"학교 내에서 전염병이 발생하면 보건교사는 학교장에게 보고하고, 학교장은 누구에게 보고해야 하나? ( {보건소장} )"},{"type":"cloze","q":"지역사회간호의 대상? ( {지역사회 전체 주민} )"},{"type":"cloze","q":"지역사회간호의 주된 보건사업은? ( {간호제공과 보건교육} )"},{"type":"cloze","q":"지역사회간호의 목표? ( {주민 스스로 건강문제 해결} → {건강증진} )"},{"type":"cloze","q":"지역사회 간호사업을 할 때 가장 먼저 실시해야 하고 중요한 것은? ( {보건실태 파악} → {건강문제 확인} )"},{"type":"cloze","q":"지역사회 간호사업 우선순위 결정 시 가장 먼저 고려해야 할 사항은?( {많은 수의 지역주민에게 영향을 주는 문제} )"},{"type":"cloze","q":"생명을 위협할 정도의 극심한 스트레스를 경험한 후 발생하는 심리적 반응은? ( {외상 후 스트레스} )"},{"type":"cloze","q":"6개월 이상 지속적이고 만성이며 지나치게 비현실적인 걱정과 불안을 호소한다면? ( {범불안장애} )"},{"type":"cloze","q":"정신재활 병원으로 사회복귀를 도와주고, 가족의 심리적, 경제적 부담을 감소시켜주는 재활기관은? ( {낮병원} )"},{"type":"cloze","q":"지역사회 정신건강의 대상은? ( {지역 주민 전체} )"},{"type":"cloze","q":"정신이상 환자의 태도와 행동에 변화를 주기 위한 의사소통의 방법은? ( {치료적 의사소통} )"},{"type":"cloze","q":"치료적 의사소통 시 가장 중요한 기법은? ( {경청(공감)} )"},{"type":"cloze","q":"지역사회 정신보건사업의 1차예방 사업은 ({스트레스 대처프로그램} ), 2차 예방은 ({우울증 조기검진사업} ), 3차 예방은 ({사회복귀 직업 훈련} ) 등이다."},{"type":"cloze","q":"지역사회 보건사업 후 보건간호 내용을 기록하는 이유는? ( {환자나 가족의 계속적인 간호를 위해} )"},{"type":"cloze","q":"지역사회 간호활동 중 가장 효과가 큰 사업은? ( {가정방문} )"},{"type":"cloze","q":"가족을 단위로 한 건강관리에 그 목적이 있으며 지역사회 보건사업 중 가장 큰 비중을 차지하는 것? ( {가정방문} )"},{"type":"cloze","q":"가정방문의 장점? ( {포괄적인 간호제공, 가족의 건강문제를 직접 관찰} )"},{"type":"cloze","q":"가정방문의 단점? ( {같은 경험을 가진 다른 사람과의 경험을 나눌 기회가 없다}. )"},{"type":"cloze","q":"가정방문의 우선순위? ( {신생아, 미숙아} → {임산부} → {학령전 아동} → {학동기 아동} → {성병 환자} → {결핵 환자} )"},{"type":"cloze","q":"지역사회 콜레라 발생 시 주민에게 알리는 가장 효과적인 방법은? ( {방송매체} )"},{"type":"cloze","q":"지역사회 간호업무 중 가장 포괄적이고 중요한 사업은? ( {보건교육} )"},{"type":"cloze","q":"지역사회 간호 과정의 순서? ( {사정(자료수집)} → {진단(건강문제 확인)}→ {계획(우선순위, 목표 설정)}→ {수행} → {평가} )"},{"type":"cloze","q":"의료인이란? ( {의사, 치과의사, 한의사, 조산사, 간호사} )"},{"type":"cloze","q":"병원급: ({30병상} ) 이상, 종합병원: ({100병상~300병상} /7과목), ({300병상~500병상} /9과목), 상급종합: ({20과목 이상})"},{"type":"cloze","q":"의료인은 임신 32주이전에 태아의 성별을 임부나 가족에게 알리면 안되는 금기사항? ( {태아의 성감별 행위 금지} )"},{"type":"cloze","q":"의료인의 품위를 심하게 손상 시키는 행위를 했다면? ( {의료인의 자격 정지} )"},{"type":"cloze","q":"정신질환자, 마약 또는 향정신성의약품 중독자, 금고 이상의 형을 받았다면? ( {의료인의 면허 취소} )"},{"type":"cloze","q":"간호조무사는 ( {보건복지부} )의 자격 인정을 받아야 하고, 간호조무사의 업무 한계는 ( {보건복지부령} )으로 정함."},{"type":"cloze","q":"감염병 예방을 위해 보건복지부 장관은 ( {5년} )마다 계획을 수립해야 한다."},{"type":"c attern","q":"Where ~?","a":"어디 있어?","ex":"Where's Hanul? / 하늘이 어디 있어?"},{"type":"pattern","q":"Is there ~?","a":"~이 있어?","ex":"Is there a roller coaster here? / 여기 롤러코스터 있어?"},{"type":"pattern","q":"Is he ~?","a":"그는 ~이니? (누군가에 대해 물을 때)","ex":"Is he sick? / 그 애 아프니?"},{"type":"pattern","q":"be + ~ing","a":"~하고 있다 (지금 하는 일)","ex":"I'm riding a bike. / 자전거 타고 있어."},{"type":"pattern","q":"I like ~","a":"나는 ~을 좋아해","ex":"I like playing basketball. / 난 농구하는 걸 좋아해."},{"type":"pattern","q":"like ~","a":"~처럼, ~을 닮은","ex":"It looks like rain. / 비가 올 것 같아."},{"type":"pattern","q":"It is raining.","a":"비가 오고 있어요","ex":"It rains cats and dogs. / 비가 억수같이 쏟아지고 있어요."},{"type":"pattern","q":"be + ~ing (가까운 미래)","a":"~할 거야 (가까운 미래 계획)","ex":"I'm going fishing tomorrow. / 내일 낚시하러 갈 거야."},{"type":"pattern","q":"Would you like ~?","a":"~하실래요? (권할 때)","ex":"Would you like to come to my house? / 우리 집에 놀러 올래?"},{"type":"pattern","q":"Do you ~?","a":"너 ~하니? (물어볼 때)","ex":"Do you know where the theater is? / 극장이 어디 있는지 알아?"},{"type":"pattern","q":"have ~","a":"~을 가지고 있다, 먹다","ex":"I have a dog called Beethoven. / 난 베토벤이라는 개를 키워."},{"type":"pattern","q":"will ~","a":"~할 것이다 (앞으로 일어날 일)","ex":"Next week I'll be in New York. / 다음 주에 난 뉴욕에 있을 거야."},{"type":"pattern","q":"I want you to ~","a":"네가 ~했으면 해","ex":"I want you to study in the U.S.A. / 난 네가 미국에서 공부했으면 해."},{"type":"pattern","q":"have to ~","a":"(상황상) ~해야만 한다","ex":"You have to go. Your mom is waiting for you. / 넌 가야 해. 엄마가 기다리시잖아."},{"type":"pattern","q":"don't have to ~","a":"~할 필요가 없다","ex":"You don't have to come to the airport. / 공항에 올 필요 없어."},{"type":"pattern","q":"only have to ~","a":"~하기만 하면 된다","ex":"You only have to telephone me next week. / 넌 다음 주에 나한테 전화만 하면 돼."},{"type":"pattern","q":"had + 사람 + 동사원형","a":"(누가) ~에게 ~하게 시켰다","ex":"She had me take him to the airport. / 그녀가 나에게 그를 공항에 데려다주라고 했어."},{"type":"pattern","q":"would rather A than B","a":"B하느니 차라리 A하겠다","ex":"I would rather wear blue jeans than a dress. / 드레스를 입느니 차라리 청바지를 입겠어."},{"type":"pattern","q":"look forward to ~ing","a":"~하기를 고대하다","ex":"I look forward to wearing a dress. / 난 드레스 입기를 기대해."},{"type":"pattern","q":"What color ~?","a":"어떤 색 ~?","ex":"What color suit are you wearing? / 어떤 색 옷을 입을 거야?"},{"type":"pattern","q":"This explains why ~","a":"그래서 ~였구나 (왜 그런지 알겠다)","ex":"This explains why you're called Miss World. / 네가 왜 미스월드라고 불리는지 알겠어."},{"type":"pattern","q":"I wonder ~","a":"~일까? 도대체 뭘까","ex":"I wonder what that is. / 저건 도대체 뭘까."},{"type":"pattern","q":"no longer","a":"더 이상 ~않다","ex":"You shall no longer use this car. / 더 이상 이 차를 몰지 마."},{"type":"pattern","q":"So am I.","a":"나도 그래","ex":"Iri is Japanese. — So am I. / 이리는 일본 사람이야. — 나도 그래."},{"type":"pattern","q":"I'm not sure ~","a":"~인지 확실치 않아","ex":"I'm not sure when we will be leaving. / 우리가 언제 떠날지 확실치 않아."},{"type":"pattern","q":"Why don't I ~?","a":"내가 ~하는 게 어때?","ex":"Why don't I stay here and take phone messages? / 내가 여기 있으면서 전화 받는 게 어때?"},{"type":"pattern","q":"As ~","a":"~하면서 (두 가지가 동시에)","ex":"As we sped along the highway, I ate the apple. / 고속도로를 달리면서 나는 사과를 먹었다."},{"type":"pattern","q":"If ~","a":"만약 ~라면","ex":"If you help me, I'll help you. / 네가 날 도우면 나도 널 도울게."},{"type":"pattern","q":"동사원형 ~! (명령문)","a":"~해라 (명령할 때)","ex":"Come on, you guys. Stand up! / 얘들아, 어서 일어나!"},{"type":"pattern","q":"I've been informed ~","a":"~라고 연락받았어요","ex":"I've just been informed that it is snowing. / 방금 연락받았는데 눈이 오고 있대."},{"type":"pattern","q":"What ~?","a":"무엇 ~?","ex":"What are you making? / 무슨 음식 만들어?"},{"type":"pattern","q":"would (가능)","a":"~할 거야, ~할 텐데","ex":"How can he come inside? He'd melt. / 눈사람이 어떻게 들어와? 녹아 버릴걸."},{"type":"pattern","q":"might (추측)","a":"~일지도 모른다","ex":"School might be closed tomorrow. / 내일 학교 수업을 안 할지도 몰라."},{"type":"pattern","q":"I thought ~","a":"~인 줄 알았어","ex":"I thought we were dead. / 난 우리가 죽는 줄 알았어."},{"type":"pattern","q":"No, it isn't.","a":"아니, 그렇지 않아","ex":"Your fly is open. — No, it isn't. / 지퍼 열렸어. — 아니, 안 열렸어."},{"type":"pattern","q":"How ~?","a":"어떻게 ~?","ex":"How is Philip going to get home? / 필립은 어떻게 집에 가죠?"},{"type":"pattern","q":"might as well ~","a":"~하는 게 낫겠다","ex":"I might as well spend the night here. / 여기서 자고 가는 게 낫겠어."},{"type":"pattern","q":"Where ~? (장소)","a":"어디서 ~?","ex":"Where are we going to eat? / 우리 어디서 먹을 거야?"},{"type":"pattern","q":"wherever ~","a":"어디에 있든지","ex":"Wherever they are, I'm sure they're fine. / 아이들이 어디 있든지 다 무사할 거예요."},{"type":"pattern","q":"How much ~?","a":"얼마나 많이 ~?","ex":"How much money did Mom give us? / 엄마가 우리한테 돈을 얼마나 주셨어?"},{"type":"pattern","q":"I knew why.","a":"난 왜 그런지 알았어","ex":"I knew why. The power is out. / 왜 그런지 알아. 전기가 나간 거야."},{"type":"pattern","q":"~ is not working.","a":"~이 고장 났어, 작동이 안 돼","ex":"The phone's not working. / 전화가 안 돼."},{"type":"pattern","q":"What made you ~?","a":"왜(무엇 때문에) ~했어?","ex":"What made you fall in love with Dad? / 엄마는 어떻게 아빠랑 사랑에 빠졌어요?"},{"type":"pattern","q":"Let's ~","a":"~하자","ex":"Let's sing a song. / 우리 노래하자."},{"type":"pattern","q":"What are you wearing?","a":"뭐 입었어?","ex":"What are you wearing today? — I've got a red dress on. / 오늘 뭐 입었어? — 빨간 드레스 입었어."},{"type":"pattern","q":"What are you going to do?","a":"뭐 할 거야?","ex":"What are you going to do today? / 오늘 뭐 할 건데?"},{"type":"pattern","q":"Are there ~?","a":"~이 (여럿) 있니?","ex":"Are there my friends at your home? / 너희 집에 내 친구들 있니?"},{"type":"pattern","q":"How's it going?","a":"잘 지내니?","ex":"How's it going? — Not so good. / 잘 지내? — 그저 그래."},{"type":"pattern","q":"because ~","a":"~때문에 (이유)","ex":"Tommy awoke because Minnie ran into his bed. / 미니가 침대로 뛰어들어서 토미가 깼다."},{"type":"pattern","q":"neither A nor B","a":"A도 B도 아니다","ex":"Neither Bora nor Boram is here. / 보라도 보람이도 여기 없어."},{"type":"pattern","q":"until ~","a":"~할 때까지","ex":"We chatted until they came. / 우린 그들이 올 때까지 수다를 떨었다."},{"type":"pattern","q":"Is this what ~?","a":"이게 ~하던 거야?","ex":"Is this what you're looking for? / 이게 네가 찾던 거야?"},{"type":"pattern","q":"both A and B","a":"A와 B 둘 다","ex":"Both Bora and Boram came to us. / 보라와 보람이 둘 다 우리에게 왔다."},{"type":"pattern","q":"Don't you know ~?","a":"~인지 몰라?","ex":"Don't you know what these are? / 이게 뭔지 몰라?"},{"type":"pattern","q":"That's why ~","a":"그게 바로 ~한 이유야","ex":"That's why I'm here. / 그게 바로 내가 여기 있는 이유지."},{"type":"pattern","q":"about ~","a":"~에 대해서","ex":"Think about English and write about what it means to you. / 영어에 대해 생각해 보고 너에게 어떤 의미인지 써 봐."},{"type":"pattern","q":"How big ~?","a":"얼마나 큰 ~?","ex":"How big would they be? / 그것들은 얼마나 클까?"},{"type":"pattern","q":"If it were not for ~","a":"만약 ~가 없다면","ex":"We'd never fight if it weren't for you. / 네가 없었다면 우리는 절대 안 싸웠을 거야."},{"type":"pattern","q":"You'll have to ~","a":"넌 ~해야만 할 거야","ex":"You'll have to work pretty hard to be a millionaire. / 백만장자가 되려면 아주 열심히 일해야 할 거야."},{"type":"pattern","q":"as long as ~","a":"~하는 한","ex":"As long as the neighbors don't complain, I play my stereo loud. / 이웃이 불평하지 않는 한 난 스테레오를 크게 틀어."},{"type":"pattern","q":"Go + 동사원형","a":"가서 ~해","ex":"Go shut the door. / 가서 문 닫아."},{"type":"pattern","q":"It's ~ (날씨)","a":"(날씨가) ~하다","ex":"It's a bright, sunny day out, right? / 밖은 밝고 화창한 날이야, 그렇지?"},{"type":"pattern","q":"I can make + 사람 + 동사원형","a":"~가 …하게 만들 수 있어","ex":"I can make her sing with this. / 난 이걸로 그녀가 노래하게 할 수 있어."},{"type":"pattern","q":"It's fun to ~","a":"~하는 건 재미있어","ex":"It's fun to swim with a dolphin. / 돌고래랑 수영하는 건 재미있어요."},{"type":"pattern","q":"You don't need to ~","a":"~할 필요 없어","ex":"You don't need to tell him twice. / 그 애한테 두 번 말할 필요는 없어."},{"type":"pattern","q":"So did I. / So was I.","a":"나도 그랬어 (동의)","ex":"Karen put on her safety belt. — So did I. / 카렌은 안전벨트를 맸어. — 나도 그랬어."},{"type":"pattern","q":"Do you want me to ~?","a":"내가 ~해 주길 원해?","ex":"Do you want me to read you a story? / 내가 책 읽어 줄까?"},{"type":"pattern","q":"I need you to ~","a":"네가 ~해 줬으면 해","ex":"I need you to help me lift this box. / 이 상자 드는 걸 도와줬으면 해."},{"type":"pattern","q":"used to ~","a":"예전에 ~했었다, 원래 ~였다","ex":"You used to live in Busan? / 원래 부산에 살았지요?"},{"type":"pattern","q":"Are you saying that ~?","a":"~라는 말이야?","ex":"Are you saying that all they do is watch TV? / 그 애들이 하는 거라곤 TV 보는 것뿐이라는 말이야?"},{"type":"pattern","q":"-er / more ~ than","a":"~보다 더 ~한","ex":"She talks longer than Mommy does. / 그 애는 우리 엄마보다 더 길게 통화해요."},{"type":"pattern","q":"What do I do ~?","a":"나 뭐 하지?","ex":"What do I do when I'm home alone? / 혼자 집에 있을 때 뭐 하지?"},{"type":"pattern","q":"That's being ~","a":"그게 ~가 되는 거야","ex":"That's being a friend. / 그게 친구가 되는 거야."},{"type":"pattern","q":"How about ~?","a":"~는 어때?","ex":"How about if I write a note to your parents? / 내가 네 부모님께 편지를 쓰면 어떨까?"},{"type":"pattern","q":"~ing (주어)","a":"~하는 것 (동명사)","ex":"Finding a place to hold the meeting turned out to be a problem. / 모임 장소를 찾는 게 문제로 드러났어."},{"type":"pattern","q":"be sure to ~","a":"틀림없이 ~할 것이다","ex":"Someone is sure to overhear us. / 누군가 우리 말을 엿듣게 될 게 확실해."},{"type":"pattern","q":"Do you intend to ~?","a":"~할 생각이야?","ex":"Do you intend to have a party here? / 여기서 파티를 열 생각이야?"},{"type":"pattern","q":"what ~ (관계대명사)","a":"~한 것","ex":"That's what we decided to do. / 그게 우리가 하기로 결정한 거야."},{"type":"pattern","q":"Since ~","a":"~이므로, ~이래로","ex":"Since no one was using the field, we stood in the middle of it. / 아무도 운동장을 쓰지 않아서 우리는 한가운데 서 있었다."},{"type":"pattern","q":"would (과거 습관)","a":"~하곤 했다","ex":"The snow would melt as soon as it touched the ground. / 눈은 땅에 닿자마자 녹곤 했다."},{"type":"pattern","q":"as good as ~","a":"~나 다름없다","ex":"They are as good as dead. / 그 사람들은 죽은 거나 다름없어요."},{"type":"pattern","q":"could have + p.p.","a":"~할 뻔했다, ~할 수 있었을 텐데","ex":"He could have been hit by a car. / 그는 차에 치일 뻔했어."},{"type":"pattern","q":"so ~ (that) ... could","a":"너무 ~해서 …할 수 있었다","ex":"It got so quiet, you could hear the milk going down his throat. / 너무 조용해서 우유 넘어가는 소리가 들릴 정도였다."},{"type":"pattern","q":"ever (강조)","a":"절대로, 다시는","ex":"Don't ever do that again! / 다시는 그런 짓 하지 마!"},{"type":"pattern","q":"I said ~","a":"내가 ~라고 했잖아","ex":"I said don't touch it! / 그거 만지지 말라고 했잖아!"},{"type":"pattern","q":"Maybe you should ~","a":"~해야 할 것 같아","ex":"Maybe you should apologize to her. / 너 그녀에게 사과해야 할 것 같아."}]}]</script>

function load(){

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const TYPE_LABEL={word:'단어',pattern:'패턴',sentence:'문장',cloze:'빈칸'};
const TYPE_REV=Object.fromEntries(Object.entries(TYPE_LABEL).map(([k,v])=>[v,k]));

/* ============================ 빈칸 문법 ============================ */
function clozeParts(s){
  const parts=[];let last=0;const re=/\{([^{}]+)\}/g;let m;
  while((m=re.exec(s))){if(m.index>last)parts.push({t:'text',v:s.slice(last,m.index)});parts.push({t:'blank',v:m[1].trim()});last=re.lastIndex}
  if(last<s.length)parts.push({t:'text',v:s.slice(last)});
  return parts;
}
const isCloze=s=>/\{[^{}]+\}/.test(s||'');
const clozeHTML=s=>clozeParts(s).map(p=>p.t==='blank'?`<span class="red">${esc(p.v)}</span>`:esc(p.v)).join('');
const clozePlain=s=>s.replace(/\{([^{}]+)\}/g,'( ___ )');

/* ============================ 채점 ============================ */
const norm=s=>String(s||'').toLowerCase().replace(/[\s.,·~\-–—_()\[\]'"!?;:/]/g,'');
function candidates(exp){
  const set=new Set();const add=x=>{const n=norm(x);if(n)set.add(n)};
  add(exp);
  const noParen=exp.replace(/\([^)]*\)/g,'');add(noParen);
  (exp.match(/\(([^)]*)\)/g)||[]).forEach(x=>add(x.slice(1,-1)));
  noParen.split(/[,/·;]|또는/).forEach(add);
  return set;
}
const localMatch=(exp,given)=>norm(given)!==''&&candidates(exp).has(norm(given));
async function aiJudge(pairs){
  const key=DB.settings.geminiKey;if(!key)return null;
  const prompt=`너는 암기 학습 채점자다. 각 항목에서 학생 답이 정답과 의미상 같은지 판정하라.
동의어, 띄어쓰기, 사소한 철자 차이, 한글/영어 표기 차이는 정답으로 인정한다. 뜻이 다르거나 핵심이 빠지면 오답이다.
JSON으로만 답하라: {"results":[true,false,...]} (항목 순서대로)
항목:
${pairs.map((p,i)=>`${i+1}. 문제: ${p.q}\n   정답: ${p.expected}\n   학생 답: ${p.given}`).join('\n')}`;
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(DB.settings.model||'gemini-2.5-flash')}:generateContent?key=${encodeURIComponent(key)}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:0}})});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    const txt=j.candidates?.[0]?.content?.parts?.map(p=>p.text).join('')||'';
    const res=JSON.parse(txt.replace(/```json|```/g,'')).results;
    return Array.isArray(res)&&res.length===pairs.length?res.map(Boolean):null;
  }catch(e){console.warn('AI 채점 실패',e);toast('AI 채점에 실패해 기본 채점으로 처리했어요');return null}
}

function renderHome(){
  const tabs=[['mine','📂 내 챕터'],['lib','📚 기본 세트'],['wrong','❗ 오답 복습'],['stats','📊 학습 통계']];

  if(view.tab==='lib')h+=homeLib();

  if(view.tab==='stats')h+=homeStats();

}
function chapterAcc(ch){let c=0,w=0;ch.items.forEach(i=>{c+=i.c||0;w+=i.w||0});return c+w?Math.round(c/(c+w)*100):null}
function homeMine(){
  let h=`<div class="row" style="margin:6px 0 4px">
    <button class="btn pri" onclick="newChapter()">+ 챕터 추가</button>
    <button class="btn" onclick="pickFile({target:'new'})">📥 파일에서 만들기 (엑셀·한글)</button>
  </div>`;
  if(!DB.chapters.length)return h+`<div class="card empty">아직 챕터가 없어요.<br><b>📚 기본 세트</b>에서 가져오거나, 새 챕터를 만들어 보세요.<br><br><button class="btn pri" onclick="go('home',{tab:'lib'})">기본 세트 보러 가기</button></div>`;
  const groups={};DB.chapters.forEach(c=>{(groups[c.category||'기타']=groups[c.category||'기타']||[]).push(c)});
  Object.keys(groups).forEach(g=>{
    h+=`<div class="sec-title">${esc(g)} <span class="muted">(${groups[g].length})</span></div><div class="grid">`;
    groups[g].forEach(c=>{const acc=chapterAcc(c);const nc=c.items.filter(i=>i.type==='cloze').length;
      h+=`<div class="card chap" onclick="go('chapter',{id:'${c.id}'})"><h3>${esc(c.name)}</h3>
      <div class="muted">${c.items.length}개 항목${nc?` · 빈칸 ${nc}`:''}${acc!==null?` · 정답률 ${acc}%`:''}</div></div>`});
    h+=`</div>`;
  });
  return h;
}

     <div class="row"><button class="btn adm" onclick="newLibSet()">+ 새 기본 세트</button>
     <button class="btn adm" onclick="pickFile({target:'lib'})">📥 파일로 기본 세트 만들기 (엑셀·한글)</button>

     ${dirty?`<button class="btn" onclick="if(confirm('관리 모드에서 고친 내용을 버리고 현재 파일의 기본 세트로 되돌릴까요?')){DB.lib=null;save();render()}">↺ 파일 버전으로 되돌리기</button>`:''}</div></div>`;
  } else h+=`<p class="muted">미리 만들어 둔 세트예요. 많은 세트는 <b>${PART}개씩</b> 나눠서 원하는 만큼 골라 담을 수 있어요.</p>`;
  if(!sets.length)return h+`<div class="card empty">기본 세트가 없어요.</div>`;
  const cats=[...new Set(sets.map(s=>s.cat||'기타'))];
  cats.forEach(cat=>{
    h+=`<div class="sec-title">${esc(cat)}</div><div class="grid">`;
    sets.filter(s=>(s.cat||'기타')===cat).forEach(s=>{
      const n=s.items.length,np=Math.ceil(n/PART);const idx=sets.indexOf(s);
      h+=`<div class="card libc"><h3>${esc(s.name)}</h3>
      <div class="muted">${s.desc?esc(s.desc)+' · ':''}${n}개${np>1?` · ${PART}개씩 ${np}세트`:''}</div>
      <div class="row"><button class="btn sm" onclick="previewLib('${s.id}')">미리보기</button>
      <button class="btn sm pri" onclick="${np>1?`pickParts('${s.id}')`:`addOneLib('${s.id}')`}">${np>1?'세트 고르기':'+ 내 챕터에 추가'}</button>
      ${isAdmin()?`<button class="btn sm" title="이름·분류 바꾸기" onclick="renameLib('${s.id}')">🏷 이름</button><button class="btn sm" title="항목 편집" onclick="openLibEditor('${s.id}')">✏️ 항목</button><button class="btn sm" title="위로" onclick="moveLib(${idx},-1)">↑</button><button class="btn sm" title="아래로" onclick="moveLib(${idx},1)">↓</button>`:''}</div></div>`});
    h+=`</div>`;
  });
