}
function previewLib(id){const s=getLib(id);showPreview(s.name,s.items)}
function partLabel(k,n){return `${String(k+1).padStart(2,'0')}`}
function partName(s,k){return `${s.name} Day ${partLabel(k)}`}
function pickParts(id){
  const s=getLib(id);const n=s.items.length,np=Math.ceil(n/PART);
  const have=new Set(DB.chapters.map(c=>c.name));
  openModal(`<h3>${esc(s.name)}</h3><div class="muted">${n}개를 ${PART}개씩 ${np}세트로 나눴어요. 공부할 세트를 고르세요.</div>
  <div class="row" style="margin:10px 0"><button class="btn sm" onclick="document.querySelectorAll('.part').forEach(p=>p.classList.add('sel'));partCnt()">전체 선택</button><button class="btn sm" onclick="document.querySelectorAll('.part').forEach(p=>p.classList.remove('sel'));partCnt()">선택 해제</button><span class="muted" id="partCnt">0세트 선택</span></div>
  <div class="parts">${Array.from({length:np},(_,k)=>{const its=s.items.slice(k*PART,k*PART+PART);
    return `<div class="part ${have.has(partName(s,k))?'have':''}" data-k="${k}" onclick="this.classList.toggle('sel');partCnt()"><b>Day ${partLabel(k)}</b>${k*PART+1}~${k*PART+its.length}<div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(its[0].type==='cloze'?clozePlain(its[0].q):its[0].q)}…</div></div>`}).join('')}</div>
  <div class="field" style="margin-top:12px"><label>내 챕터 이름 (뒤에 Day 번호가 붙어요)</label><input id="partName" value="${esc(s.name)}"></div>
  <label class="row muted" style="gap:6px"><input type="checkbox" id="partMerge"> 고른 세트를 하나의 챕터로 합치기 (체크 안 하면 Day별로 따로 만들어요)</label>
  <div class="row end" style="margin-top:12px"><button class="btn" onclick="closeModal()">취소</button><button class="btn pri" id="partGo">내 챕터에 추가</button></div>`);
  $('#partGo').onclick=()=>{const ks=[...document.querySelectorAll('.part.sel')].map(p=>+p.dataset.k);if(!ks.length)return toast('세트를 하나 이상 골라 주세요');addLibParts(id,ks,$('#partMerge').checked,$('#partName').value.trim())};
}
function addOneLib(id){const s=getLib(id);setForm('내 챕터에 추가',{name:s.name,cat:s.cat},(n,c)=>{const ch=makeChapter(n,c,s.items);toast('내 챕터에 추가했어요');go('chapter',{id:ch.id})},true)}
function partCnt(){$('#partCnt').textContent=document.querySelectorAll('.part.sel').length+'세트 선택'}
function addLibParts(id,ks,merge,nm){
  const s0=getLib(id);const s={...s0,name:nm||s0.name};const np=Math.ceil(s.items.length/PART);let last;
  const slice=k=>s.items.slice(k*PART,k*PART+PART);
  if(np<=1)last=makeChapter(s.name,s.cat,s.items);
  else if(merge){const ord=[...ks].sort((a,b)=>a-b);last=makeChapter(`${s.name} Day ${partLabel(ord[0])}${ord.length>1?'~'+partLabel(ord[ord.length-1]):''}${ord.length>1&&ord[ord.length-1]-ord[0]+1!==ord.length?' (선택)':''}`,s.cat,ord.flatMap(slice))}
  else ks.sort((a,b)=>a-b).forEach(k=>{last=makeChapter(partName(s,k),s.cat,slice(k))});
  closeModal();
  if(np>1&&!merge&&ks.length>1){toast(`${ks.length}개 챕터를 추가했어요`);go('home',{tab:'mine'})}
  else{toast('내 챕터에 추가했어요');go('chapter',{id:last.id})}
}
function makeChapter(name,category,items){
  const ch={id:uid(),name:name||'새 챕터',category:category||'기타',createdAt:Date.now(),items:normItems(items)};
  DB.chapters.push(ch);save();return ch;
}
function normItems(items){return (items||[]).map(i=>({id:uid(),type:i.type||(isCloze(i.q)?'cloze':'word'),q:String(i.q||'').trim(),a:String(i.a||'').trim(),ex:String(i.ex||'').trim(),c:0,w:0})).filter(i=>i.q&&(i.type==='cloze'?isCloze(i.q):i.a))}
function showPreview(title,items,onAdd,addLabel){
  openModal(`<h3>${esc(title)}</h3><div class="muted">${items.length}개 항목</div>
  <ul class="items" style="max-height:58vh;overflow:auto;margin-top:8px">${items.map(itemRowHTML).join('')}</ul>
  <div class="row end" style="margin-top:12px"><button class="btn" onclick="closeModal()">닫기</button>${onAdd?`<button class="btn pri" id="pvAdd">${addLabel||'+ 추가'}</button>`:''}</div>`);
  if(onAdd)$('#pvAdd').onclick=onAdd;
}
function itemRowHTML(i){
  if(i.type==='cloze')return `<li><span class="typebadge cloze">빈칸</span><div class="q">${clozeHTML(i.q)}</div></li>`;
  return `<li><span class="typebadge ${i.type==='pattern'?'pattern':''}">${TYPE_LABEL[i.type]||'단어'}</span><div class="q">${esc(i.q)}</div><div class="a">${esc(i.a)}${i.ex?`<span class="ex">${esc(i.ex)}</span>`:''}</div></li>`;
}
/* 관리: 기본 세트 편집 */

function openLibEditor(id){ensureLibEdit();go('chapter',{id,lib:true})}
function moveLib(i,d){ensureLibEdit();const a=DB.lib,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}
function copyToLib(chId){const ch=getCh(chId);ensureLibEdit();const s={id:'set-'+uid(),name:ch.name,cat:ch.category||'기타',desc:'',items:ch.items.map(i=>({type:i.type,q:i.q,a:i.a,ex:i.ex||''}))};DB.lib.push(s);save();toast('기본 세트로 복사했어요');go('home',{tab:'lib'})}
function exportIndex(){
  const lib=libSets().map(s=>({id:s.id,cat:s.cat||'기타',name:s.name,desc:s.desc||'',items:s.items.map(i=>{const o={type:i.type,q:i.q};if(i.a)o.a=i.a;if(i.ex)o.ex=i.ex;return o})}));

  <div class="row end"><button class="btn pri" onclick="closeModal()">확인</button></div>`);

  return h;

function removeWrong(chId,itId){if(DB.wrong[chId])DB.wrong[chId]=DB.wrong[chId].filter(x=>x!==itId)}

/* ---------- 통계 ---------- */
function homeStats(chId){
  const chs=chId?[getCh(chId)]:DB.chapters;
  let c=0,w=0,all=[];chs.forEach(ch=>ch.items.forEach(i=>{c+=i.c||0;w+=i.w||0;all.push({ch,i})}));
  const hist=DB.history.filter(x=>!chId||x.chapterId===chId);
  const tot=c+w;const acc=tot?Math.round(c/tot*100):0;
  let h=`<div class="card"><div class="row" style="gap:28px">
    <div><div class="muted">학습 횟수</div><b style="font-size:22px">${hist.length}회</b></div>
    <div><div class="muted">푼 문제</div><b style="font-size:22px">${tot}</b></div>

  <div class="card" style="margin:0"><b>⚠️ 어려운 항목 TOP 5</b>${hard.length?`<ol style="padding-left:18px;margin:8px 0 0">${hard.map(x=>`<li>${label(x)} <span class="muted">${x.i.c}/${x.i.c+x.i.w}</span></li>`).join('')}</ol>`:'<div class="muted">기록 없음</div>'}</div></div>`;

const parseLine=defType=>l=>{

/* ============================ 빨간 글씨 / 표 인식 ============================ */
function parseColor(c){
  if(!c)return null;c=String(c).trim().toLowerCase();
  const named={red:[255,0,0],darkred:[139,0,0],crimson:[220,20,60],firebrick:[178,34,34],tomato:[255,99,71],orangered:[255,69,0],maroon:[128,0,0]};
  if(named[c])return named[c];
  let m=c.match(/^#?([0-9a-f]{3})$/);if(m)return m[1].split('').map(x=>parseInt(x+x,16));
  m=c.match(/^#?(?:[0-9a-f]{2})?([0-9a-f]{6})$/);if(m)return [0,2,4].map(i=>parseInt(m[1].substr(i,2),16));
  m=c.match(/rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/);if(m)return [+m[1],+m[2],+m[3]];
  return 'other';
}
function isRedColor(c){const v=parseColor(c);if(!v)return null;if(v==='other')return false;const [r,g,b]=v;return r>=120&&r-Math.max(g,b)>=70&&g<=130&&b<=130}
// 세그먼트 [{t,red}] → "문장 {빨간부분}"
function segsToLine(segs){
  let out='',inRed=false;
  segs.forEach(s=>{
    if(s.red&&!s.t.trim()){out+=s.t;return}
    if(s.red&&!inRed){out+='{';inRed=true}
    if(!s.red&&inRed){out=out.replace(/(\s*)$/,'}$1');inRed=false}
    out+=s.t.replace(/[{}]/g,'');
  });
  if(inRed)out=out.replace(/(\s*)$/,'}$1');
  return out.replace(/\{(\s+)/g,'$1{').replace(/\{\s*\}/g,'').replace(/\s+/g,' ').trim();
}
const segsText=segs=>segs.map(s=>s.t).join('').replace(/\s+/g,' ').trim();
const stripNum=s=>s.replace(/^\(?\s*\d{1,3}\s*[.)]\s+/,'').replace(/^\(?\s*\d{1,3}\s*[.)](?=\S)/,'');
// rows: [[cellSegs,...],...] → items
function rowsToItems(rows,defType='word',opt={}){
  const items=[];let skipped=0;
  const R=rows.map(cells=>cells.filter(c=>segsText(c))).filter(c=>c.length).map(cells=>{
    const txt=cells.map(segsText);const red=cells.some(c=>c.some(s=>s.red&&s.t.trim()));
    return {cells,txt,red,cz:red||txt.some(isCloze),multi:cells.length>=2};
  });
  const lineOf=r=>r.cells.map(c=>r.red?segsToLine(c):segsText(c));
  let header=null,ctx=null;
  R.forEach((r,k)=>{
    const nx=R[k+1],pv=R[k-1];
    if(r.cz){
      let line;const parts=lineOf(r).map(x=>x.trim());
      if(r.multi){
        if(header&&header.length===parts.length)line=parts[0]+' — '+parts.slice(1).map((x,j)=>header[j+1]+': '+x).join(' / ');
        else line=parts[0]+(/[?:？]$/.test(parts[0])?' ':': ')+parts.slice(1).join(', ');
        if(ctx)line=`[${ctx}] `+line;
      } else {
        line=parts[0];header=null;ctx=null;
        if(pv&&!pv.cz&&!pv.multi&&/[?:？]\s*$/.test(pv.txt[0]))line=pv.txt[0]+' '+line;
      }
      line=stripNum(line);
      if(isCloze(line)){items.push({type:'cloze',q:line,a:''});return}
    }
    // 빨간 글씨 없는 줄
    if(r.multi&&nx&&nx.cz&&nx.multi&&nx.cells.length===r.cells.length&&!r.cz){header=r.txt;return}
    if(!r.multi&&!r.cz&&nx&&nx.cz){
      if(nx.multi&&(/[:：]\s*$/.test(r.txt[0])||r.txt[0].length<=20)){ctx=r.txt[0].replace(/[:：]\s*$/,'').trim();return}
      if(!nx.multi&&/[?:？]\s*$/.test(r.txt[0]))return; // 다음 줄 답과 합침
    }
    if(r.multi){
      let p=r.txt;
      if(/^\d+$/.test(p[0])&&p.length>=3)p=p.slice(1);
      if(k<3&&p.some(x=>/^(문제|단어|영어|영단어|뜻|의미|해석|예문|word|words|question|answer|meaning|korean|english|유형|번호|no\.?)$/i.test(x)))return;
      let type=defType;if(p.length>=3&&TYPE_REV[p[0]]){type=TYPE_REV[p[0]];p=p.slice(1)}
      if(p[0]&&p[1]){items.push({type,q:p[0],a:p[1],ex:p.slice(2).join(' ')});return}
    }
    const t=stripNum(r.txt.join('\t'));
    if(opt.comma||/[\t|]/.test(t)){const one=parseLine(defType)(t);if(one){items.push(one);return}}
    skipped++;
  });
  return {items,skipped};
}
// HTML(붙여넣기) → rows
function htmlToRows(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const classColor={};
  doc.querySelectorAll('style').forEach(st=>{const re=/\.([\w-]+)\s*\{([^}]*)\}/g;let m;while((m=re.exec(st.textContent))){const cm=m[2].match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);if(cm)classColor[m[1]]=cm[1]}});
  const BLOCK=/^(P|DIV|LI|H[1-6]|UL|OL|BLOCKQUOTE|SECTION|ARTICLE|TABLE|TBODY|THEAD)$/;
  const rows=[];let row=[],cell=[],inCell=0;
  const flushCell=()=>{row.push(cell);cell=[]};
  const flushRow=()=>{if(cell.length)flushCell();if(row.some(c=>c.length))rows.push(row);row=[]};
  const elColor=el=>{let c=el.style&&el.style.color;if(c)return c;if(el.getAttribute('color'))return el.getAttribute('color');for(const k of el.classList||[])if(classColor[k])return classColor[k];return null};
  function walk(n,red){
    if(n.nodeType===3){const t=n.nodeValue.replace(/[ ↵]/g,' ').replace(/[\r\n]+/g,' ');if(t)cell.push({t,red});return}
    if(n.nodeType!==1)return;const tag=n.tagName;
    if(/^(STYLE|SCRIPT|HEAD|TITLE)$/.test(tag))return;
    if(tag==='BR'){if(inCell)cell.push({t:' ',red});else flushRow();return}
    const c=elColor(n);let r=red;if(c){const v=isRedColor(c);if(v!==null)r=v}
    if(tag==='TR'){flushRow();n.childNodes.forEach(x=>walk(x,r));flushRow();return}
    if(tag==='TD'||tag==='TH'){if(cell.length)flushCell();inCell++;n.childNodes.forEach(x=>walk(x,r));inCell--;flushCell();return}
    const blk=BLOCK.test(tag);
    if(blk){if(inCell)cell.push({t:' ',red});else flushRow()}
    n.childNodes.forEach(x=>walk(x,r));
    if(blk){if(inCell)cell.push({t:' ',red});else flushRow()}
  }
  walk(doc.body,false);flushRow();
  return rows;
}
function onRichPaste(e){
  e.preventDefault();
  const cd=e.clipboardData;const html=cd.getData('text/html');const plain=cd.getData('text/plain');
  const rows=html?htmlToRows(html):plain.split(/\r?\n/).map(l=>l.split('\t').map(t=>[{t,red:false}]));
  const viaComma=!html;
  $('#paste').textContent=`(${rows.length}줄 붙여넣음)`;
  const {items,skipped}=rowsToItems(rows,'word',{comma:viaComma});
  openImport({title:curSet().name,items,skipped,target:'this',source:'붙여넣기'});
}

// ZIP 해제 (브라우저 내장 기능 사용, 외부 라이브러리 없음)
async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);let e=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)throw new Error('압축 파일 형식이 아니에요');
  const cnt=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};const dec=new TextDecoder();
  for(let k=0;k<cnt;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;

// 엑셀 .xlsx → [{name, rows}]
async function readXlsx(buf){
  const z=await unzip(buf);
  const IDX={2:'FF0000',10:'FF0000',16:'800000',37:'800000',53:'993300',60:'993300'};
  const colorOf=el=>{if(!el)return null;const rgb=el.getAttribute('rgb');if(rgb)return rgb;const ix=el.getAttribute('indexed');if(ix&&IDX[ix])return IDX[ix];return null};
  // 스타일 → 글자색
  const fontRed=[],xfRed=[];
  const st=await z.text('xl/styles.xml');
  if(st){const d=xml(st);const fonts=byLocal(d,'fonts')[0];if(fonts)kids(fonts,'font').forEach(f=>{const c=kids(f,'color')[0];fontRed.push(!!isRedColor(colorOf(c)))});
    const xfs=byLocal(d,'cellXfs')[0];if(xfs)kids(xfs,'xf').forEach(x=>xfRed.push(!!fontRed[+x.getAttribute('fontId')||0]))}
  // 공유 문자열 (서식 있는 텍스트 포함)
  const runSegs=(si,baseRed)=>{const rs=kids(si,'r');if(!rs.length){const t=kids(si,'t')[0];return [{t:t?t.textContent:'',red:baseRed}]}
    return rs.map(r=>{const pr=kids(r,'rPr')[0];let red=baseRed;if(pr){const c=kids(pr,'color')[0];if(c){const v=isRedColor(colorOf(c));if(v!==null)red=v}}const t=kids(r,'t')[0];return {t:t?t.textContent:'',red}})};
  const ssEls=[];const ss=await z.text('xl/sharedStrings.xml');if(ss)ssEls.push(...kids(xml(ss).documentElement,'si'));
  // 시트 목록
  const wb=xml(await z.text('xl/workbook.xml'));const rels=xml(await z.text('xl/_rels/workbook.xml.rels')||'<x/>');
  const relMap={};byLocal(rels,'Relationship').forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));
  const sheets=[];
  for(const s of byLocal(wb,'sheet')){
    const rid=s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||s.getAttribute('r:id');
    let tg=relMap[rid]||'';tg=tg.replace(/^\//,'');if(!tg.startsWith('xl/'))tg='xl/'+tg;
    const sx=await z.text(tg);if(!sx)continue;
    const rows=[];
    byLocal(xml(sx),'row').forEach(r=>{
      const cells=[];
      kids(r,'c').forEach(c=>{
        const ref=c.getAttribute('r')||'';const col=ref.replace(/\d+/g,'').split('').reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1;
        const t=c.getAttribute('t');const baseRed=!!xfRed[+c.getAttribute('s')||0];let segs;
        if(t==='s'){const si=ssEls[+(kids(c,'v')[0]?.textContent)];segs=si?runSegs(si,baseRed):[]}
        else if(t==='inlineStr'){const is=kids(c,'is')[0];segs=is?runSegs(is,baseRed):[]}
        else{const v=kids(c,'v')[0];segs=v?[{t:v.textContent,red:baseRed}]:[]}
        cells[col>=0?col:cells.length]=segs;
      });
      rows.push(Array.from(cells,c=>c||[]));
    });
    sheets.push({name:s.getAttribute('name'),rows});
  }
  return sheets;
}
// 한글 .hwpx → rows
async function readHwpx(buf){
  const z=await unzip(buf);
  const red={};const hd=await z.text('Contents/header.xml');
  if(hd)byLocal(xml(hd),'charPr').forEach(c=>{red[c.getAttribute('id')]=!!isRedColor(c.getAttribute('textColor'))});
  const secs=z.names.filter(n=>/^Contents\/section\d+\.xml$/i.test(n)).sort((a,b)=>parseInt(a.match(/\d+/))-parseInt(b.match(/\d+/)));
  if(!secs.length)throw new Error('한글 본문을 찾지 못했어요');
  const rows=[];
  const paraSegs=(p,tables)=>{const segs=[];
    kids(p,'run').forEach(run=>{const r=!!red[run.getAttribute('charPrIDRef')];
      [...run.children].forEach(ch=>{
        if(ch.localName==='t')segs.push({t:ch.textContent,red:r});
        else if(ch.localName==='tbl')tables.push(ch);
        else{byLocal(ch,'tbl').forEach(t=>{if(!tables.includes(t))tables.push(t)})}
      });
    });return segs};
  const cellSegs=tc=>{const out=[];byLocal(tc,'p').forEach(p=>{if(p.closest&&false)return;const segs=paraSegs(p,[]);if(out.length)out.push({t:' ',red:false});out.push(...segs)});return out};
  const doTable=tbl=>{kids(tbl,'tr').forEach(tr=>rows.push(kids(tr,'tc').map(cellSegs)))};
  const doPara=p=>{const tables=[];const segs=paraSegs(p,tables);if(segsText(segs))rows.push([segs]);tables.forEach(doTable)};
  for(const n of secs){const d=xml(await z.text(n));kids(d.documentElement,'p').forEach(doPara)}
  return rows;
}

function parseCSVLine(l){const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const c=l[i];if(q){if(c==='"'&&l[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}else{if(c==='"')q=true;else if(c===','){out.push(cur);cur=''}else cur+=c}}out.push(cur);return out}

async function importFile(file,opts={}){
  const name=file.name,base=name.replace(/\.[^.]+$/,'');
  try{
    if(/\.hwp$/i.test(name))return openModal(`<h3>한글(.hwp) 파일</h3><p>.hwp 파일은 브라우저에서 바로 읽을 수 없어요. 아래 두 방법 중 하나를 써 주세요.</p>
      <ol style="line-height:1.9;padding-left:20px"><li>한글에서 <b>파일 → 다른 이름으로 저장 → 파일 형식: HWPX</b>로 저장한 뒤 그 파일을 올리기</li><li>한글에서 내용을 <b>전체 선택(Ctrl+A) → 복사</b>한 뒤, 챕터의 <b>🔴 빨간글씨</b> 칸에 붙여넣기</li></ol>
      <div class="row end"><button class="btn pri" onclick="closeModal()">확인</button></div>`);
    if(/\.xls$/i.test(name))return toast('예전 엑셀(.xls)은 읽을 수 없어요. 엑셀에서 .xlsx로 저장해 주세요');
    if(/\.xlsx$/i.test(name)){
      const sheets=(await readXlsx(await file.arrayBuffer())).map(s=>({...s,...rowsToItems(s.rows)})).filter(s=>s.items.length);
      if(!sheets.length)throw new Error('인식된 항목이 없어요');
      return openImport({title:sheets.length===1?base:base,items:sheets[0].items,skipped:sheets[0].skipped,sheets,target:opts.target,source:'엑셀'});
    }
    if(/\.hwpx$/i.test(name)){const r=rowsToItems(await readHwpx(await file.arrayBuffer()));if(!r.items.length)throw new Error('인식된 항목이 없어요. 빨간 글씨나 2칸 표가 있는지 확인해 주세요');return openImport({title:base,...r,target:opts.target,source:'한글'})}
    const text=(await file.text()).replace(/^﻿/,'');
    if(/\.json$/i.test(name)){
      const j=JSON.parse(text);
      if(j.format==='dongdong-backup'){
        if(confirm('전체 백업 파일이에요. 지금 데이터를 백업 내용으로 바꿀까요?\n(취소를 누르면 챕터만 추가돼요)')){localStorage.setItem(LS_KEY,JSON.stringify(j.data));DB=load();toast('복원했어요')}
        else{(j.data.chapters||[]).forEach(c=>makeChapter(c.name,c.category,c.items));toast('챕터를 추가했어요')}
        closeModal();return go('home',{tab:'mine'});
      }
      return openImport({title:j.name||base,category:j.category,desc:j.description,items:j.items||[],skipped:0,target:opts.target,source:'세트 파일'});
    }
    let r;
    if(/\.csv$/i.test(name))r=rowsToItems(textRows(text.split(/\r?\n/).filter(l=>l.trim()).map(parseCSVLine)));
    else r=rowsToItems(textRows(text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.includes('\t')?l.split('\t'):[l])),'word',{comma:true});
    if(!r.items.length)throw new Error('인식된 항목이 없어요');
    openImport({title:base,...r,target:opts.target,source:'텍스트'});
  }catch(e){console.error(e);toast('파일을 읽지 못했어요: '+e.message)}
}

let S=null;
const MODE_LABEL={flash:'플래시 카드',q2a:'문제→뜻 쓰기',a2q:'뜻→문제 쓰기'};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startStudy(chId,mode,onlyIds,isWrong){
  const ch=getCh(chId);let its=ch.items;
  if(onlyIds)its=its.filter(i=>onlyIds.includes(i.id));
  else if(view.name==='chapter'&&view.range!=null&&view.range!=='all'){const k=+view.range;its=its.slice(k*PART,k*PART+PART)}
  if(!its.length)return toast('공부할 항목이 없어요');
  if(DB.settings.shuffle!==false)its=shuffle([...its]);
  S={chId,mode,items:its,idx:0,correct:0,wrong:0,wrongIds:[],isWrong:!!isWrong,state:'ask',range:view.range};
  go('study');
}
function startWrong(chId){
  openModal(`<h3>오답 복습 방식</h3><div class="row" style="margin-top:10px">${Object.entries(MODE_LABEL).filter(([k])=>k!=='flash').map(([k,l])=>`<button class="btn pri" onclick="closeModal();startStudy('${chId}','${k}',DB.wrong['${chId}'].slice(),true)">${l}</button>`).join('')}</div><div class="muted" style="margin-top:8px">오답은 쓰기로 맞혀야 목록에서 빠져요. 그냥 훑어보려면 <a href="#" onclick="closeModal();startStudy('${chId}','flash',DB.wrong['${chId}'].slice(),true);return false">플래시 카드로 보기</a></div>
  <div class="row end" style="margin-top:12px"><button class="btn" onclick="closeModal()">취소</button></div>`);
}
function renderStudy(){
  if(!S)return renderHome();
  const it=S.items[S.idx];const n=S.items.length;const done=S.correct+S.wrong;
  const pct=done?Math.round(S.correct/done*100):0;
  let h=`<div class="row between" style="margin-top:14px"><div class="row" style="gap:6px"><button class="btn sm" onclick="backFromStudy()">← 이전 메뉴</button>${S.mode==='flash'?'':`<button class="btn sm" onclick="endStudy()">■ 공부 종료</button>`}</div>
    <div class="stats3"><span>${S.idx+1} / ${n}</span>${S.mode==='flash'?'':`<span>성취도 <b>${pct}%</b></span>`}${S.mode==='flash'?'':`<span style="color:var(--ok)">○ ${S.correct}</span><span style="color:var(--bad)">✕ ${S.wrong}</span>`}</div></div>
    <div class="progress"><div style="width:${(S.mode==='flash'?S.idx+1:S.idx)/n*100}%"></div></div>
    <div class="muted">${esc(getCh(S.chId).name)} · ${MODE_LABEL[S.mode]}${S.isWrong?' · 오답 복습':''}</div>`;
  const cloze=it.type==='cloze';
  if(S.mode==='flash'){
    if(cloze){
      h+=`<div class="qbox">${clozeParts(it.q).map(p=>p.t==='blank'?`<span class="mask" onclick="this.classList.add('show')">${esc(p.v)}</span>`:esc(p.v)).join('')}</div>
      <div class="row" style="justify-content:center"><button class="btn sm" onclick="document.querySelectorAll('.mask').forEach(m=>m.classList.add('show'))">👀 전체 보기</button><span class="muted">빨간 칸을 누르면 하나씩 보여요</span></div>`;
    } else {
      h+=`<div class="flash" onclick="this.classList.toggle('flipped')"><div class="inner">
        <div class="face">${esc(it.q)}<span class="hint">눌러서 뒤집기 (스페이스)</span></div>
        <div class="face back">${esc(it.a)}${it.ex?`<div class="exs">${esc(it.ex)}</div>`:''}<span class="hint">${esc(it.q)}</span></div></div></div>`;
    }
    h+=`<div class="bigbtns"><button class="btn" onclick="prevCard()" ${S.idx===0?'disabled':''}>← 이전</button><button class="btn pri" onclick="nextCard()">${S.idx===n-1?'다 봤어요 ✓':'다음 →'}</button></div>`;
  } else {
    if(cloze)h+=`<div class="qbox">${clozeParts(it.q).map((p,k)=>p.t==='blank'?`<input class="blank" data-k="${k}" size="${Math.max(4,Math.min(16,p.v.length*1.6|0))}" autocomplete="off">`:esc(p.v)).join('')}</div>`;
    else{const ask=S.mode==='q2a'?it.q:it.a;
      h+=`<div class="qbox center">${esc(ask)}</div><input class="answer-in" id="ans" autocomplete="off" autocapitalize="off" placeholder="${S.mode==='q2a'?'뜻을 입력하세요':'영어(원래 문제)를 입력하세요'}">`}
    h+=`<div id="verdict"></div><div class="row end" style="margin-top:10px" id="actBtns">
      <button class="btn" onclick="giveUp()">모르겠어요</button><button class="btn pri" id="chkBtn" onclick="check()">확인 (Enter)</button></div>`;
  }
  return h;
}
function afterStudyRender(){const f=document.querySelector('#ans')||document.querySelector('.blank');if(f)f.focus()}
function answer(ok){record(ok);next()}
function record(ok){
  const it=S.items[S.idx];
  if(ok){it.c=(it.c||0)+1;S.correct++;if(S.isWrong)removeWrong(S.chId,it.id)}
  else{it.w=(it.w||0)+1;S.wrong++;S.wrongIds.push(it.id);addWrong(S.chId,it.id)}
  save();
}
function next(){S.idx++;S.state='ask';if(S.idx>=S.items.length)return finish();render()}
async function check(){
  if(S.state!=='ask')return;
  const it=S.items[S.idx];S.state='checking';$('#chkBtn').disabled=true;$('#chkBtn').textContent='채점 중…';
  let exps,givens,qtext;
  if(it.type==='cloze'){exps=clozeParts(it.q).filter(p=>p.t==='blank').map(p=>p.v);givens=[...document.querySelectorAll('.blank')].map(i=>i.value.trim());qtext=clozePlain(it.q)}
  else{exps=[S.mode==='q2a'?it.a:it.q];givens=[$('#ans').value.trim()];qtext=S.mode==='q2a'?it.q:it.a}
  const results=exps.map((e,k)=>localMatch(e,givens[k]));
  let usedAI=false;
  const idxs=results.map((r,k)=>(!r&&givens[k])?k:-1).filter(k=>k>=0);
  if(idxs.length&&DB.settings.geminiKey){const ai=await aiJudge(idxs.map(k=>({q:qtext,expected:exps[k],given:givens[k]})));if(ai){usedAI=true;idxs.forEach((k,j)=>{if(ai[j])results[k]=true})}}
  showVerdict(it,results.every(Boolean),exps,givens,results,usedAI);
}
function giveUp(){
  if(S.state!=='ask')return;const it=S.items[S.idx];
  const exps=it.type==='cloze'?clozeParts(it.q).filter(p=>p.t==='blank').map(p=>p.v):[S.mode==='q2a'?it.a:it.q];
  showVerdict(it,false,exps,exps.map(()=>''),exps.map(()=>false),false);
}
function showVerdict(it,ok,exps,givens,results,usedAI){
  S.state='shown';S.lastOk=ok;
  if(it.type==='cloze'){document.querySelectorAll('.blank').forEach((inp,k)=>{inp.readOnly=true;inp.classList.add(results[k]?'ok':'no');if(!results[k]){const s=document.createElement('span');s.className='fix';s.textContent='→ '+exps[k];inp.after(s)}})}
  else $('#ans').readOnly=true;
  $('#verdict').innerHTML=`<div class="verdict ${ok?'ok':'no'}">${ok?'⭕ 정답!':'❌ 오답'}${usedAI?' <span class="muted">(AI 채점)</span>':''}
   ${it.type!=='cloze'?`<div style="margin-top:4px">정답: <b>${esc(exps[0])}</b></div>`:''}${it.ex?`<div class="muted" style="margin-top:4px">예문: ${esc(it.ex)}</div>`:''}</div>`;
  $('#actBtns').innerHTML=`${!ok&&givens.some(Boolean)?`<button class="btn" onclick="S.lastOk=true;nextAfter()">맞은 걸로 할게요</button>`:''}<button class="btn pri" onclick="nextAfter()">다음 (Enter)</button>`;
}
function nextAfter(){if(S.state!=='shown')return;S.state='done';record(S.lastOk);next()}
function prevCard(){if(S.idx>0){S.idx--;render()}}
function nextCard(){if(S.idx<S.items.length-1){S.idx++;render()}else go('result')}
function finish(){
  const ch=getCh(S.chId);
  DB.history.push({date:Date.now(),chapterId:S.chId,chapterName:ch.name,mode:MODE_LABEL[S.mode]+(S.isWrong?'(오답)':''),correct:S.correct,wrong:S.wrong});
  if(DB.history.length>300)DB.history=DB.history.slice(-300);save();go('result');
}
function backFromStudy(){
  const id=S.chId,range=S.range;
  if(S.mode!=='flash'&&S.correct+S.wrong>0&&!confirm('공부를 그만두고 이전 메뉴로 갈까요?\n(지금까지 푼 문제의 정답·오답은 저장돼요)'))return;
  S=null;go('chapter',{id,range});
}
function endStudy(){if(S.mode==='flash'||S.correct+S.wrong===0){const id=S.chId;S=null;return go('chapter',{id})}if(confirm('공부를 종료하고 결과를 볼까요?'))finish()}
function renderResult(){
  if(S.mode==='flash'){const id=S.chId;return `<div class="card" style="text-align:center;margin-top:20px"><div class="muted">${esc(getCh(id).name)} · 플래시 카드</div>
  <div class="result-num">🎉</div><div style="font-size:18px"><b>${S.items.length}개</b>를 다 봤어요!</div>
  <div class="row" style="justify-content:center;margin-top:18px">
   <button class="btn pri" onclick="S.idx=0;go('study')">처음부터 다시</button>
   <button class="btn pri" onclick="shuffle(S.items);S.idx=0;go('study')">섞어서 다시</button>
   <button class="btn ok" onclick="view={name:'chapter',id:'${id}',range:S.range};startStudy('${id}','q2a')">✏️ 쓰기로 확인하기</button>
   <button class="btn" onclick="go('chapter',{id:'${id}',range:S.range})">목록으로</button></div></div>`}
  const t=S.correct+S.wrong;const pct=t?Math.round(S.correct/t*100):0;
  const ch=getCh(S.chId);const wr=ch.items.filter(i=>S.wrongIds.includes(i.id));
  return `<div class="card" style="text-align:center;margin-top:20px"><div class="muted">${esc(ch.name)} · ${MODE_LABEL[S.mode]}</div>
  <div class="result-num">${pct}%</div><div>${pct>=90?'🎉 아주 잘했어요!':pct>=70?'👍 좋아요!':'💪 조금만 더!'}</div>
  <div class="stats3" style="justify-content:center;margin:10px 0"><span style="color:var(--ok)">정답 ${S.correct}</span><span style="color:var(--bad)">오답 ${S.wrong}</span></div>
  <div class="row" style="justify-content:center;margin-top:14px">
   <button class="btn pri" onclick="view={name:'chapter',id:'${S.chId}',range:S.range};startStudy('${S.chId}','${S.mode}')">다시 공부</button>
   ${wr.length?`<button class="btn bad" onclick="startStudy('${S.chId}','${S.mode}',S.wrongIds.slice(),true)">틀린 것만 다시</button>`:''}
   <button class="btn" onclick="go('home',{tab:'stats'})">통계 보기</button><button class="btn" onclick="go('chapter',{id:'${S.chId}',range:S.range})">목록으로</button></div></div>
  ${wr.length?`<div class="card"><b>틀린 항목</b><ul class="items">${wr.map(itemRowHTML).join('')}</ul></div>`:''}`;
}
document.addEventListener('keydown',e=>{
  if(view.name!=='study'||!S||$('.modal-bg'))return;
  if(S.mode==='flash'){
    if(e.key===' '){e.preventDefault();const f=$('.flash');if(f)f.classList.toggle('flipped');else document.querySelectorAll('.mask').forEach(m=>m.classList.add('show'))}
    if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();nextCard()}if(e.key==='ArrowLeft')prevCard();
  } else if(e.key==='Enter'){
    e.preventDefault();
    if(S.state==='ask'){const bl=[...document.querySelectorAll('.blank')];const i=bl.indexOf(document.activeElement);if(i>=0&&i<bl.length-1){bl[i+1].focus();return}check()}
    else if(S.state==='shown')nextAfter();
  }
});

/* ============================ 설정 ============================ */
function openSettings(){
  const s=DB.settings;
  openModal(`<h3>⚙️ 설정</h3>
  <div class="field"><label>Gemini API 키 (AI 채점용, 선택) — <a href="https://aistudio.google.com/apikey" target="_blank">Google AI Studio에서 무료 발급</a></label><input id="sK" type="password" value="${esc(s.geminiKey)}" placeholder="AIza…"></div>
  <div class="field"><label>Gemini 모델</label><input id="sM" value="${esc(s.model)}"></div>
  <label class="row" style="gap:8px;margin:14px 0"><input type="checkbox" id="sA" ${s.admin?'checked':''}> <span><b>기본 세트 관리 모드</b> <span class="muted">— 사이트 관리자용. 기본 세트를 만들고 고친 뒤 index.html로 내보내요</span></span></label>
  <p class="muted">데이터·API 키는 이 브라우저(로컬 스토리지)에만 저장돼요. 기기를 바꿀 땐 백업 파일을 이용하세요.</p>
  <div class="row"><button class="btn" onclick="backupAll()">💾 전체 백업 받기</button><button class="btn" onclick="closeModal();pickFile({target:'new'})">📥 백업 복원/가져오기</button>
  <button class="btn" style="color:var(--bad)" onclick="if(confirm('모든 챕터와 기록을 지울까요? 되돌릴 수 없어요.')){DB.chapters=[];DB.history=[];DB.wrong={};save();closeModal();go('home',{tab:'mine'})}">전체 초기화</button></div>
  <div class="row end" style="margin-top:14px"><button class="btn" onclick="closeModal()">취소</button><button class="btn pri" id="sSave">저장</button></div>`);
  $('#sSave').onclick=()=>{Object.assign(s,{geminiKey:$('#sK').value.trim(),model:$('#sM').value.trim()||'gemini-2.5-flash',admin:$('#sA').checked});save();closeModal();toast('저장했어요');if(view.lib&&!s.admin)go('home',{tab:'lib'});else render()};
}
function backupAll(){download(`동동이암기장_백업_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({format:'dongdong-backup',version:3,data:{...DB,settings:{...DB.settings,geminiKey:''}}}))}

/* ============================ 모달 ============================ */
function openModal(html){closeModal();const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal">${html}</div>`;bg.onclick=e=>{if(e.target===bg)closeModal()};document.body.appendChild(bg);bindDrops()}
function closeModal(){document.querySelectorAll('.modal-bg').forEach(m=>m.remove())}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ============================ 이전 버전 데이터 가져오기 ============================ */
(function migrate(){
  if(DB.chapters.length||DB._migrated)return;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);if(k===LS_KEY)continue;
      let v;try{v=JSON.parse(localStorage.getItem(k))}catch(e){continue}
      const arr=Array.isArray(v)?v:(v&&Array.isArray(v.chapters)?v.chapters:null);
      if(!arr||!arr.length||!arr[0]||!Array.isArray(arr[0].items))continue;
      arr.forEach(c=>makeChapter(c.name||c.title||'가져온 챕터','기타',(c.items||[]).map(it=>({type:['word','pattern','sentence'].includes(it.type)?it.type:'word',q:it.q||it.question||it.word||it.front||'',a:it.a||it.answer||it.meaning||it.back||''}))));
      toast('이전 버전의 챕터를 가져왔어요');break;
    }
  }catch(e){}
  DB._migrated=true;save();
})();

render();
</script>


</body></html>
